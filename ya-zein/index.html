<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>يا زين هالطّلّة | تحديات المفاجأة</title><link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Markazi+Text:wght@500;600;700&family=Lateef:wght@700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:'El Messiri',Tahoma,sans-serif;color:#170b32}button,textarea{font:inherit}button{cursor:pointer;border:3px solid #210b36;border-radius:18px;background:#fff;color:#210b36;padding:10px 20px;font-weight:700;box-shadow:5px 5px 0 #210b36}button:disabled{opacity:.45}#app{height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:2vh 3vw;gap:1.5vh;background:#ffe438;transition:background .3s}header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-weight:700;font-size:clamp(20px,2vw,32px)}.actions{display:flex;gap:9px;flex-wrap:wrap}main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh}.home-title{font-size:clamp(55px,8vw,126px);line-height:1.25;margin:0;font-family:'Markazi Text',serif;font-weight:700;text-shadow:5px 5px #fff}.subtitle{font-size:clamp(20px,2vw,35px)}textarea{width:min(850px,94vw);height:24vh;resize:none;background:#fff;border:4px solid #1e1034;border-radius:22px;padding:20px;font-size:clamp(18px,1.5vw,24px)}.name{font-family:'El Messiri',sans-serif;font-size:clamp(48px,6.8vw,112px);font-weight:700;line-height:1.3;color:#171025;text-shadow:4px 4px #fff}.pre{font-size:clamp(22px,2.5vw,40px);font-weight:700}.count{font-family:'El Messiri',sans-serif;font-size:clamp(130px,24vw,340px);font-weight:700;line-height:1;color:#fff;-webkit-text-stroke:5px #1e1034;text-shadow:10px 12px #f90083;animation:pop .75s ease infinite alternate}.challenge{font-family:'El Messiri',sans-serif;font-size:clamp(30px,4.5vw,78px);font-weight:700;line-height:1.65;max-width:1200px;color:#120d23;text-wrap:balance;animation:pop .5s ease}.timer{font-size:clamp(30px,4vw,60px);font-weight:700;background:#fff;border:3px solid #1e1034;border-radius:20px;padding:0 22px}.controls{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;width:100%}.primary{background:#f90083;color:white}.muted{font-size:clamp(14px,1.3vw,20px)}.hide{display:none!important}@keyframes pop{from{transform:scale(.88);opacity:.5}to{transform:scale(1);opacity:1}}@media(max-height:700px){.name{font-size:clamp(38px,5vw,75px)}.challenge{font-size:clamp(26px,3.5vw,54px)}button{padding:6px 13px}.home-title{font-size:clamp(45px,6vw,90px)}}@media print{html,body{height:auto;overflow:visible}#app{display:none!important}#printArea{display:grid!important;grid-template-columns:1fr 1fr;gap:12mm;padding:12mm}.print-card{border:3px solid #24163a;border-top:10px solid #f90083;padding:10mm;min-height:75mm;break-inside:avoid;font-family:Tahoma,sans-serif}.print-card h2{margin:0 0 10px}.print-card p{font-size:18px}}#printArea{display:none}
</style></head><body><div id="app"><header><div class="logo">🌈 يا زين هالطّلّة!</div><div class="actions"><button onclick="home()">⌂ الرئيسية</button><button onclick="skip()">⏭ سكب</button><button onclick="printAll()">🖨 طباعة البطاقات</button><button id="sound" onclick="toggleMusic()">🔊 الموسيقى</button><button onclick="document.documentElement.requestFullscreen?.().catch(()=>{})">⛶ شاشة كاملة</button></div></header><main id="screen"></main><div id="bottom" class="controls"></div></div><div id="printArea"></div><script>
const challenges=["اختاري طالبة وقلّديها دون ذكر اسمها، وخلي زميلاتك يعرفوا مين هي!","قلّدي إحدى معلمات المدرسة دون ذكر اسمها، وزميلاتك يخمّنّ من هي!","اختاري زميلة وقلّدي ضحكتها، وعلى الباقي تخمين صاحبة الضحكة!","حافظي على وجه جاد لمدة 30 ثانية بينما زميلاتك يحاولن إضحاكك!","تحدثي لمدة 20 ثانية بلهجة مختلفة!","قولي جملة عادية وكأنك سعيدة جدًا!","اختاري زميلة وتحدّيا بعضكما: من تضحك أولًا تخسر!","امدحي نفسك بطريقة مضحكة لمدة 15 ثانية!","اختاري زميلة وقولي لها 3 صفات جميلة فيها!","دندني لحن أغنية دون كلمات، وخلي زميلاتك يخمّنّها!","قولي أول كلمة من أغنية مشهورة، وخلي زميلاتك يعرفوا الأغنية!","دوري حول نفسك دورتين ثم قفي ثابتة!","اعثري على 5 أشياء بألوان مختلفة خلال 40 ثانية!","اعثري على شيء يبدأ بالحرف الأول من اسمك!","اختاري زميلة وتنافسا في الوقوف على قدم واحدة!","شاهدي 7 أشياء ثم اكتشفي ما الذي اختفى!","شاهدي 6 أدوات ثم اكتشفي الأداتين اللتين تبدّل مكانهما!","شاهدي صورة لمدة 10 ثوانٍ ثم أجيبي عن تفاصيلها!","شاهدي 5 حركات ثم أعيديها بالترتيب!","اسمعي أسماء 5 زميلات ثم أعيديها بالترتيب!","اختاري 3 زميلات لديهن نفس هوايتك!","اختاري 4 زميلات، وحددي لونًا يناسب شخصية كل واحدة منهن!","لو كنتِ شخصية كرتونية، من ستكونين؟ قلّديها!","قولي بوجه جاد: «أنا أطالب رسميًا بإجازة بعد كل فسحة!»","قولي بعصبية تمثيلية: «مين اللي خبّى آخر قطعة شوكولاتة؟!»","قولي وأنتِ تضحكين: «الرجاء الهدوء، هذا اجتماع رسمي جدًا!»","امشي مثل عارضة أزياء ثم عودي إلى مقعدك بطريقة مضحكة! 👠","قدّمي نفسك وكأنك نجمة مشهورة في مقابلة تلفزيونية! ✨","مثّلي أنك تبحثين عن هاتفك وهو في يدك! 📱"];
let students=[],remaining=[],queue=[],current='',stage='home',clock=null,timeLeft=0,remainingChallenges=[],musicOn=true,audioCtx=null,musicLoop=null,memoryTimeout=null;
const screen=document.getElementById('screen'),bottom=document.getElementById('bottom'),app=document.getElementById('app');
const colors=['#FFE438','#FF64C3','#59E4F1','#B49AFF','#FF8E59','#8DE8A0'];
function clearClock(){if(clock){clearInterval(clock);clock=null}if(musicLoop){clearInterval(musicLoop);musicLoop=null}if(memoryTimeout){clearTimeout(memoryTimeout);memoryTimeout=null}}
function tone(freq,duration=.11){if(!musicOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.045,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration+.02)}catch(e){}}
function startMusic(){if(!musicOn||musicLoop)return;let i=0;const notes=[392,523,659,784,659,523,440,587];musicLoop=setInterval(()=>tone(notes[(i++)%notes.length],.14),220)}
function toggleMusic(){musicOn=!musicOn;document.getElementById('sound').textContent=musicOn?'🔊 الموسيقى':'🔇 صامت';if(!musicOn&&musicLoop){clearInterval(musicLoop);musicLoop=null}else if(musicOn&&stage!=='home'&&stage!=='done')startMusic()}

function randomItem(arr){return arr.splice(Math.floor(Math.random()*arr.length),1)[0]}
function color(){app.style.background=colors[Math.floor(Math.random()*colors.length)]}
function home(){clearClock();stage='home';color();screen.innerHTML='<h1 class="home-title">يا زين هالطّلّة! 🎉</h1><div class="subtitle">مفاجآت • غناء • تقليد • ضحك</div><div class="pre">اكتبي أسماء الطالبات — اسم واحد في كل سطر</div><textarea id="names" placeholder="اسم الطالبة الأولى&#10;اسم الطالبة الثانية"></textarea><div class="muted">التحديات تظهر عشوائيًا، والاسم لا يتكرر حتى تنتهي القائمة</div>';document.getElementById('names').value=students.join('\n');bottom.innerHTML='<button class="primary" onclick="start()">🎉 ابدئي المفاجآت</button><button onclick="printAll()">🖨 طباعة كل البطاقات</button>'}
function start(){const names=document.getElementById('names').value.split(/[\n،,]+/).map(x=>x.trim()).filter(Boolean);if(!names.length){alert('اكتبي اسم طالبة واحدة على الأقل');return}students=[...new Set(names)];queue=[...students];remainingChallenges=[...challenges];next()}
function skip(){if(stage==='home')return;next()}
function next(){clearClock();if(!queue.length){stage='done';screen.innerHTML='<h1 class="home-title">خلصنا يا نجمات! 🌟</h1><div class="subtitle">كل الطالبات شاركن!</div>';bottom.innerHTML='<button class="primary" onclick="queue=[...students];remainingChallenges=[...challenges];next()">🔄 جولة جديدة</button><button onclick="home()">الرئيسية</button>';return}current=randomItem(queue);if(!remainingChallenges.length)remainingChallenges=[...challenges];const task=randomItem(remainingChallenges);window.currentTask=task;stage='countdown';color();screen.innerHTML='<div class="pre">استعدّي يا نجمة!</div><div class="name"></div><div class="count" id="count">5</div>';screen.querySelector('.name').textContent=current;bottom.innerHTML='<button onclick="reveal()">⚡ كشف الآن</button><button onclick="skip()">⏭ سكب</button>';startMusic();let n=5;clock=setInterval(()=>{n--;if(n===0){clearClock();reveal()}else{const el=document.getElementById('count');if(el)el.textContent=n}},1000)}
function reveal(){clearClock();stage='reveal';color();startMusic();screen.innerHTML='<div class="name"></div><div class="challenge"></div>';screen.querySelector('.name').textContent=current;screen.querySelector('.challenge').textContent=window.currentTask;timeLeft=30;if(challenges.indexOf(window.currentTask)>=15&&challenges.indexOf(window.currentTask)<=19){setupMemory();return}bottom.innerHTML='<button onclick="next()">🎲 الطالبة التالية</button><button onclick="skip()">⏭ سكب</button>'}
function updateTimer(){const el=document.getElementById('timer');if(el)el.textContent='00:'+String(timeLeft).padStart(2,'0')}
function startTimer(){if(stage!=='reveal'||clock)return;clock=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearClock();const el=document.getElementById('timer');if(el)el.textContent='⏰ انتهى الوقت!'}},1000)}
function resetTimer(){clearClock();timeLeft=30;updateTimer()}
function setupMemory(){const idx=challenges.indexOf(window.currentTask);const bank=['🎒','📚','🖊️','🧸','🔑','⌚','🍎','🕶️','✂️','📱','🧢','🪙'];const random=arr=>arr.sort(()=>Math.random()-.5);const initial=random([...bank]).slice(0,idx===15?7:6);let after=[...initial],question='',answer='';if(idx===15){const gone=after.pop();answer=gone;question='ما الشيء الذي اختفى؟'}if(idx===16){[after[1],after[4]]=[after[4],after[1]];answer=initial[1]+' و '+initial[4];question='أي أداتين تبدّل مكانهما؟'}if(idx===17){question='ما الرموز التي شاهدتِها؟ اذكري أكبر عدد تتذكرينه.';answer=initial.join(' ')}if(idx===18){question='أعيدي الحركات الخمس بالترتيب!';initial.splice(0,initial.length,...['👏','🙋','👍','🫶','👋']);answer=initial.join(' ← ')}if(idx===19){initial.splice(0,initial.length,...random([...students]).slice(0,5));while(initial.length<5)initial.push(['سارة','مريم','فاطمة','نورة','ليان'][initial.length]);answer=initial.join(' ← ');question='أعيدي الأسماء الخمسة بالترتيب!'}
const display=arr=>arr.map(x=>'<span style="display:inline-flex;background:white;border:3px solid #210b36;border-radius:20px;padding:12px 20px;margin:5px;font-size:clamp(25px,3vw,49px)">'+x+'</span>').join('');
const original=idx===17?['🎒','📚','🖊️','🧸','🔑','⌚','🍎']:initial;
screen.innerHTML='<div class="name"></div><div class="pre">شاهدي واحفظي!</div><div id="memory" style="max-width:95vw">'+display(original)+'</div>';screen.querySelector('.name').textContent=current;
bottom.innerHTML='<button class="primary" onclick="next()">🎲 الطالبة التالية</button><button onclick="skip()">⏭ سكب</button>';
let n=10;clock=setInterval(()=>{n--;if(n===0){clearClock();startMusic();const mem=document.getElementById('memory');mem.innerHTML='<div class="challenge" style="font-size:clamp(26px,3.5vw,60px)">'+question+'</div>'+(idx===15||idx===16?'<div style="margin-top:10px">'+display(after)+'</div>':'');bottom.innerHTML='<button class="primary" id="answerButton">👀 كشف الإجابة</button><button onclick="next()">🎲 الطالبة التالية</button><button onclick="skip()">⏭ سكب</button>';document.getElementById('answerButton').onclick=()=>{const p=document.createElement('div');p.className='pre';p.textContent='الإجابة: '+answer;mem.appendChild(p)}}},1000)}
function printAll(){const area=document.getElementById('printArea');area.innerHTML='';challenges.forEach((t,i)=>{const d=document.createElement('section');d.className='print-card';const h=document.createElement('h2');h.textContent='🌈 يا زين هالطّلّة! | تحدي '+(i+1);const p=document.createElement('p');p.textContent=t;d.append(h,p);area.appendChild(d)});window.print()}
home();
</script></body></html>

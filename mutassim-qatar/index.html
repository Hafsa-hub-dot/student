function startQuiz(){stopTimer();view='quiz';quizIndex=0;score=0;quizChoice=null;quizSet=nowLesson().quiz.map((x,i)=>scramble(x[1],(lesson+1)*43+i*118));renderQuiz()}
function renderQuiz(){updateNav();if(quizIndex>=nowLesson().quiz.length){endQuiz();return}const q=nowLesson().quiz[quizIndex];quizChoice=null;$('#screen').innerHTML=`<section class="card"><div class="caption"><span class="count">الِاخْتِبَارُ · السُّؤَالُ ${quizIndex+1} مِنْ ${nowLesson().quiz.length}</span><span>${escape(nowLesson().title)}</span></div><h1 class="quiz-q">${escape(q[0])}</h1><div style="flex:1;min-height:8px"></div><div class="pick-area"><div class="pick-title">اِخْتَرِ الْإِجَابَةَ الصَّحِيحَةَ</div><div class="answers" id="answers">${quizSet[quizIndex].map((x,i)=>`<button class="option" data-quiz="${i}">${escape(x)}</button>`).join('')}</div><div class="quiz-feedback" id="quizFeedback"></div></div><div class="bottom"><span>النَّتِيجَةُ: <b>${score}</b></span><button class="small" onclick="startQuiz()">إعادة الاختبار ↺</button></div></section>`;$$('[data-quiz]').forEach((b,i)=>b.onclick=()=>chooseQuiz(i))}
function chooseQuiz(i){if(quizChoice!==null)return;quizChoice=i;const q=nowLesson().quiz[quizIndex],chosen=quizSet[quizIndex][i],ok=clean(chosen)===clean(q[2]);if(ok)score++;$$('[data-quiz]').forEach((b,j)=>{b.disabled=true;if(clean(quizSet[quizIndex][j])===clean(q[2]))b.classList.add('correct');else if(j===i)b.classList.add('incorrect')});$('#quizFeedback').textContent=ok?'صَحِيحٌ! أَحْسَنْتَ! ✓':`الْإِجَابَةُ الصَّحِيحَةُ: ${q[2]}`;$('#quizFeedback').className='quiz-feedback '+(ok?'good':'bad');timer=setTimeout(()=>{timer=null;quizIndex++;renderQuiz()},950)}
function endQuiz(){view='result';(saved[lesson]||(saved[lesson]={})).quizDone=true;updateNav();$('#screen').innerHTML=`<section class="card result"><h2>أَحْسَنْتَ يَا مُعْتَصِمُ! 🌟</h2><div class="score">${score} / ${nowLesson().quiz.length}</div><p>أَنْجَزْتَ الِاخْتِبَارَ، وَأَنْتَ تَتَقَدَّمُ فِي كُلِّ مَرَّةٍ!</p><div class="group"><button class="primary" onclick="${lesson<4?'startLesson(lesson+1)':'home()'}">${lesson<4?'الدَّرْسُ التَّالِي ←':'الرَّئِيسِيَّةُ'}</button><button class="small" onclick="startQuiz()">أَعِدِ الِاخْتِبَارَ ↺</button></div></section>`}
document.addEventListener('keydown',e=>{if(view==='study'&&/^[1-4]$/.test(e.key)){const b=$$('[data-pick]')[Number(e.key)-1];b?.click()}else if(view==='study'&&e.key==='Enter'&&!busy&&$('#advance')?.style.display!=='none')nextCard()});home();
</script></body></html>

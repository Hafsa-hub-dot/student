const Q = [{"n": 1, "text": "ماذا يحدث لدرجة الحرارة عندما تتحرك الجسيمات بشكل أسرع؟", "options": ["a. ترتفع درجة الحرارة", "b. تنخفض درجة الحرارة", "c. تبقى درجة الحرارة من دون تغيير", "d. لا يمكن قياس درجة الحرارة"], "solutions": [{"title": "الإجابة النموذجية", "answer": "a. ترتفع درجة الحرارة.", "explain": "تزداد سرعة حركة الجسيمات العشوائية، فيزداد متوسط طاقتها الحركية، وبالتالي ترتفع درجة الحرارة."}]}, {"n": 2, "text": "عرّف الطاقة الحرارية.", "solutions": [{"title": "الإجابة النموذجية", "answer": "الطاقة الحرارية هي مجموع الطاقة الحركية وطاقة الوضع لجسيمات المادة.", "explain": "تمتلك الجسيمات طاقة حركية نتيجة حركتها، وطاقة وضع نتيجة التفاعلات بينها."}]}, {"n": 3, "text": "صف كيف يرتبط تدفق الحرارة بدرجة الحرارة.", "solutions": [{"title": "الإجابة النموذجية", "answer": "تنتقل الحرارة تلقائيًا من الجسم الأعلى درجة حرارة إلى الجسم الأقل درجة حرارة.", "explain": "يسبب فرق درجة الحرارة انتقال الطاقة، ويستمر ذلك حتى يصل الجسمان إلى الاتزان الحراري."}]}, {"n": 4, "text": "ما الفرق بين درجة الحرارة والحرارة؟", "solutions": [{"title": "الإجابة النموذجية", "answer": "درجة الحرارة مقياس لمتوسط الطاقة الحركية لجسيمات المادة، أما الحرارة فهي طاقة تنتقل بين الأجسام نتيجة فرق درجات الحرارة.", "explain": "تقاس درجة الحرارة بـ °C أو K أو °F؛ وتقاس الطاقة الحرارية المنتقلة بالجول (J)."}]}, {"n": 5, "text": "قام أحد سياح مدينة الدوحة بضبط ترموستات غرفته في الفندق على 68°. لم يدرك السائح أن الترموستات يعمل بمقياس درجة سيليزي بدلًا من فهرنهايت.", "parts": [{"id": "a", "text": "هل ستصبح غرفة الفندق ساخنة، أم باردة، أم مناسبة، بعد مرور ساعة أو ساعتين؟"}, {"id": "b", "text": "حوّل درجة الحرارة التي ضبط عليها الترموستات إلى وحدة الفهرنهايت."}], "solutions": [{"id": "a", "title": "الفرع (a) — تفسير", "answer": "ستصبح الغرفة ساخنة جدًا إذا استطاع نظام التدفئة الوصول إلى 68°C.", "explain": "68°C درجة مرتفعة للغاية، بينما 68°F تساوي 20°C تقريبًا، وهي درجة مناسبة للغرفة."}, {"id": "b", "title": "الفرع (b) — التحويل", "steps": [["المطلوب", "درجة الحرارة بالفهرنهايت T_F"], ["المعطيات", "T_C let steps=sol.steps?`<div class="steps">${sol.steps.map(([a,b])=>`<div class="step"><div class="stepLabel">${esc(a)}</div><div class="stepVal ${a==='العلاقات'||a==='المعطيات'||a==='الحل'?'formula':''}">${math(b)}</div></div>`).join('')}</div>`:'';
return `<section class="screen"><div class="meta"><div class="metaTitle">السؤال ${q.n} • الإجابة النموذجية</div><div class="pageno">صفحة الكتاب 47</div></div><article class="paper"><div class="paperline"></div><div class="paperInner answerMode"><div class="answerHeader"><div class="answerTitle">${esc(sol.title)}</div>${tabs}</div><div class="answerContent">${steps}${sol.answer?`<div class="answerLead">${math(sol.answer)}</div>`:''}${sol.explain?`<div class="explain">${esc(sol.explain)}</div>`:''}</div><div class="questionFooter">${button('العودة إلى نص السؤال',"show('question')",'outline')}</div></div></article><div class="pager"><button class="pageBtn" onclick="jump(${index-1})" ${index===0?'disabled':''}>السؤال السابق</button><div class="counter">${index+1} / ${Q.length}</div><button class="pageBtn" onclick="jump(${index+1})" ${index===Q.length-1?'disabled':''}>السؤال التالي</button></div></section>`}
function qr(){return `<section class="screen"><div class="qrCard"><div class="smalltop">مراجعة إلكترونية من الكتاب المدرسي</div><h2>حل تقويم الدرس 1-2</h2><p>درجة الحرارة والحرارة • فيزياء الصف العاشر</p><img class="qrImg" src="${QR}" alt="الباركود الخاص برابط الموقع"><p>امسحي الباركود لفتح أسئلة التقويم وحلولها</p><div class="qrlink">${URL}</div><div class="qrButtons">${button('العودة للرئيسية',"show('home')",'outline')}${button('طباعة الباركود',"printBarcode()")}</div></div></section>`}
function render(){el('content').innerHTML=({home,question,answer:ans,qr})[view]();}
function printBarcode(){let doc=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>باركود حل تقويم الدرس 1-2</title><style>body{font-family:'Noto Naskh Arabic',serif;color:#243b40;text-align:center;margin:40px}article{margin:0 auto;max-width:690px;border:2px solid #aecbcb;padding:35px;border-radius:10px}h1{font-size:31px}p{font-size:24px}img{width:290px}footer{font-size:24px;margin-top:25px;color:#743d4d}</style></head><body><article><div>الفيزياء • الصف العاشر</div><h1>حل تقويم الدرس 1-2</h1><p>درجة الحرارة والحرارة • صفحة الكتاب 47</p><img src="${QR}"><p>امسحي الباركود للدخول إلى تقويم الدرس وحلوله</p><footer>مع تحيات معلمة الفيزياء حفصة طيبي</footer></article><script>window.onload=()=>window.print()<\/script></body></html>`;const win=window.open('','_blank');if(win){win.document.open();win.document.write(doc);win.document.close()}else alert('يُرجى السماح بالنوافذ المنبثقة لطباعة الباركود')}
function makePrint(){let heading=`<div class="printHeading"><h1>حل تقويم الدرس 1-2</h1><p>درجة الحرارة والحرارة • الصف العاشر • صفحة 47</p></div>`;
let body=Q.map(q=>`<section class="printQuestion ${q.n===12?'veryLong':''}"><header><span>السؤال ${q.n}</span><span>صفحة الكتاب 47</span></header><div class="pq">${esc(q.text)}</div>${q.options?q.options.map(o=>`<div class="ppart">${esc(o)}</div>`).join(''):''}${(q.parts||[]).map(p=>`<div class="ppart">(${esc(p.id)}) ${esc(p.text)}</div>`).join('')}${q.solutions.map(s=>`<div class="psol"><strong>${esc(s.title)}</strong>${(s.steps||[]).map(([a,b])=>`<div><span class="plabel">${esc(a)}:</span> ${math(b)}</div>`).join('')}${s.answer?`<div><span class="plabel">الإجابة:</span> ${math(s.answer)}</div>`:''}${s.explain?`<div>${esc(s.explain)}</div>`:''}</div>`).join('')}</section>`).join(''); el('printPack').innerHTML=heading+body+'<div class="ptfoot">مع تحيات معلمة الفيزياء حفصة طيبي</div>'}
window.addEventListener('keydown',e=>{if(view==='question'||view==='answer'){if(e.key==='ArrowLeft')jump(index+1);if(e.key==='ArrowRight')jump(index-1);if(e.key==='Escape')show('question')}});
render();makePrint();
const fontStyles=document.createElement('link');fontStyles.rel='stylesheet';fontStyles.href='https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Markazi+Text:wght@400;500;600;700&display=swap';document.head.appendChild(fontStyles);
</script></body></html>

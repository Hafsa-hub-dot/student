const Q=[{"n": 1, "text": "ماذا يحدث لدرجة الحرارة عندما تتحرك الجسيمات بشكل أسرع؟", "options": ["a. ترتفع درجة الحرارة", "b. تنخفض درجة الحرارة", "c. تبقى درجة الحرارة من دون تغيير", "d. لا يمكن قياس درجة الحرارة"], "solutions": [{"title": "الإجابة النموذجية", "answer": "a. ترتفع درجة الحرارة.", "explain": "تزداد سرعة حركة الجسيمات العشوائية، فيزداد متوسط طاقتها الحركية، وبالتالي ترتفع درجة الحرارة."}], "page": 47, "kind": "سؤال"}, {"n": 2, "text": "عرّف الطاقة الحرارية.", "solutions": [{"title": "الإجابة النموذجية", "answer": "الطاقة الحرارية هي مجموع الطاقة الحركية وطاقة الوضع لجسيمات المادة.", "explain": "تمتلك الجسيمات طاقة حركية نتيجة حركتها، وطاقة وضع نتيجة التفاعلات بينها."}], "page": 47, "kind": "سؤال"}, {"n": 3, "text": "صف كيف يرتبط تدفق الحرارة بدرجة الحرارة.", "solutions": [{"title": "الإجابة النموذجية", "answer": "تنتقل الحرارة تلقائيًا من الجسم الأعلى درجة حرارة إلى الجسم الأقل درجة حرارة.", "explain": "يسبب فرق درجة الحرارة انتقال الطاقة، ويستمر ذلك حتى يصل الجسمان إلى الاتزان الحراري."}], "page": 47, "kind": "سؤال"}, {"n": 4, "text": "ما الفرق بين درجة الحرارة والحرارة؟", "solutions": [{"title": "الإجابة النموذجية", "answer": "درجة الحرارة مقياس لمتوسط الطاقة الحركية لجسيمات المادة، أما الحرارة فهي طاقة تنتقل بين الأجسام نتيجة فرق درجات الحرارة.", "explain": "تقاس درجة الحرارة بـ °C أو K أو °F؛ وتقاس الطاقة الحرارية المنتقلة بالجول (J)."}], "page": 47, "kind": "سؤال"}, {"n": 5, "text": "قام أحد سياح مدينة الدوحة بضبط ترموستات غرفته في الفندق على 68°. لم يدرك السائح أن الترموستات يعمل بمقياس درجة سيليزي بدلًا من فهرنهايت.", "parts": [{"id": "a", "text": "هل ستصبح غرفة الفندق ساخنة، أم باردة، أم مناسبة، بعد مرور ساعة أو ساعتين؟"}, {"id": "b", "text": "حوّل درجة الحرارة التي ضبط عليها الترموستات إلى وحدة الفهرنهايت."}], "solutions": [{"id": "a", "title": "الفرع (a) — تفسير", "answer": "ستصبح الغرفة ساخنة جدًا إذا استطاع نظام التدفئة الوصول إلى 68°C.", "explain": "68°C درجة مرتفعة للغاية، بينما 68°F تساوي 20°C تقريبًا، وهي درجة مناسبة للغرفة."}, {"id": "b", "title": "الفرع (b) — التحويل", "steps": [["المطلوب", "درجة الحرارة بالفهرنهايت T_F"], ["المعطيات", "T_C = 68°C"], ["العلاقات", "T_F = (9/5) T_C + 32"], ["الحل", "T_F = (9/5) × 68 + 32 = 122.4 + 32"]], "answer": "T_F = 154.4°F", "explain": "نضرب درجة السيليزي في 9/5 ثم نضيف 32 وفق قانون الكتاب."}], "page": 47, "kind": "سؤال"}, {"n": 6, "text": "كيف تتغير الطاقة الحركية العشوائية للجزيئات عند تسخين دورق ماء؟", "solutions": [{"title": "الإجابة النموذجية", "answer": "تزداد الطاقة الحركية العشوائية لجزيئات الماء.", "explain": "تنتقل الطاقة إلى الماء فتزداد حركة جزيئاته، ويرتفع متوسط طاقتها الحركية مع ارتفاع درجة الحرارة."}], "page": 47, "kind": "سؤال"}, {"n": 7, "text": "أيّ من درجتي الحرارة 1°F أم 1°C تمثّل فرقًا أكبر في درجة الحرارة؟", "solutions": [{"title": "الإجابة النموذجية", "answer": "الفرق 1°C أكبر من الفرق 1°F.", "steps": [["العلاقات", "T_F = (9/5) T_C + 32"], ["المقارنة", "0°C تقابل 32°F، و 1°C تقابل 33.8°F. إذن فرق 1°C يقابل فرق 1.8°F."]], "explain": "باستخدام قانون الكتاب من السيليزي إلى الفهرنهايت، نقارن قراءتين متتاليتين بفارق درجة سيليزية واحدة. لا نستخدم قانونًا رابعًا."}], "page": 47, "kind": "سؤال"}, {"n": 8, "text": "ضُبط مكيّف هواء غرفة على وضع التبريد عند درجة حرارة 76°F. حوّل درجة الحرارة تلك إلى درجة سيليزية.", "solutions": [{"title": "الحل وفق قوانين الكتاب", "steps": [["المطلوب", "درجة الحرارة بالسيليزي T_C"], ["المعطيات", "T_F = 76°F"], ["العلاقات", "T_C = (5/9)(T_F − 32)"], ["الحل", "T_C = (5/9)(76 − 32) = (5/9) × 44"]], "answer": "T_C ≈ 24.4°C", "explain": "نطرح 32 من قراءة الفهرنهايت ثم نضرب الناتج في 5/9."}], "page": 47, "kind": "سؤال"}, {"n": 9, "text": "سافر سائح من مدينة الدوحة إلى نيويورك، فعلم من التلفاز أن درجة الحرارة في نيويورك 35 درجة، من دون تحديد إن كانت °C أم °F. هل هذه درجة حرارة ساخنة أم باردة على المقياسين؟ اشرح إجابتك.", "solutions": [{"title": "الإجابة والحل", "steps": [["المطلوب", "تحديد ما إذا كانت 35° حارة أم باردة على مقياسي السيليزي والفهرنهايت"], ["المعطيات", "T_F = 35°F عند استخدام الفهرنهايت"], ["العلاقات", "T_C = (5/9)(T_F − 32)"], ["الحل", "T_C = (5/9)(35 − 32) = (5/9) × 3 ≈ 1.7°C"]], "answer": "35°C: حارة. 35°F: باردة (نحو 1.7°C).", "explain": "لا يكفي ذكر العدد 35 من دون الوحدة؛ لأن المقياسين مختلفان."}], "page": 47, "kind": "سؤال"}, {"n": 10, "text": "صف حالة يحدث فيها انتقال للحرارة.", "solutions": [{"title": "الإجابة النموذجية", "answer": "عند وضع ملعقة معدنية باردة في كوب شاي ساخن، تنتقل الحرارة من الشاي إلى الملعقة.", "explain": "يحدث انتقال الحرارة بسبب فرق درجة الحرارة. وينتقل جزء من الحرارة خلال الملعقة بالتوصيل الحراري."}], "page": 47, "kind": "سؤال"}, {"n": 11, "text": "لماذا يزداد حجم إطارات السيارات بعدما تتحرك السيارة لمسافة طويلة؟", "solutions": [{"title": "الإجابة النموذجية", "answer": "ترتفع درجة حرارة الهواء داخل الإطارات، وقد تتمدد الإطارات قليلًا بسبب مرونتها.", "explain": "خلال السير ترتفع حرارة الإطار والهواء داخله، ويزداد ضغط الهواء أساسًا لأن حجم الإطار شبه ثابت؛ وقد تحدث زيادة صغيرة في حجمه."}], "page": 47, "kind": "سؤال"}, {"n": 12, "text": "قم بإجراء التحويلات بين مقاييس درجات الحرارة الآتية:", "parts": [{"id": "a", "text": "حوّل 1000 K إلى °C."}, {"id": "b", "text": "حوّل 72°F إلى °C."}, {"id": "c", "text": "حوّل −10°C إلى K."}, {"id": "d", "text": "حوّل 77 K إلى °C."}], "solutions": [{"id": "a", "title": "الفرع (a) — الكلفن إلى السيليزي", "steps": [["المطلوب", "T_C"], ["المعطيات", "T_K = 1000 K"], ["العلاقات", "T_K = T_C + 273.15"], ["الحل", "T_C = T_K − 273.15 = 1000 − 273.15"]], "answer": "T_C = 726.85°C", "explain": "هذا القانون ناتج من إعادة ترتيب T_K = T_C + 273.15."}, {"id": "b", "title": "الفرع (b) — الفهرنهايت إلى السيليزي", "steps": [["المطلوب", "T_C"], ["المعطيات", "T_F = 72°F"], ["العلاقات", "T_C = (5/9)(T_F − 32)"], ["الحل", "T_C = (5/9)(72 − 32) = (5/9) × 40"]], "answer": "T_C ≈ 22.22°C", "explain": "التقريب إلى منزلة عشرية واحدة يعطي 22.2°C."}, {"id": "c", "title": "الفرع (c) — السيليزي إلى الكلفن", "steps": [["المطلوب", "T_K"], ["المعطيات", "T_C = −10°C"], ["العلاقات", "T_K = T_C + 273.15"], ["الحل", "T_K = −10 + 273.15"]], "answer": "T_K = 263.15 K", "explain": "وحدة الكلفن K لا تكتب معها علامة الدرجة °."}, {"id": "d", "title": "الفرع (d) — الكلفن إلى السيليزي", "steps": [["المطلوب", "T_C"], ["المعطيات", "T_K = 77 K"], ["العلاقات", "T_K = T_C + 273.15"], ["الحل", "T_C = T_K − 273.15 = 77 − 273.15"]], "answer": "T_C = −196.15°C", "explain": "الناتج سالب لأن 77 K أقل من 273.15 K."}], "page": 47, "kind": "سؤال"}];

const ADDITIONAL={"62":[{"n":1,"page":62,"kind":"سؤال","text":"يقوم أحد الطلاب بتبريد غاز مجهول. وعندما يبلغ الغاز درجة حرارة 10°C، يبدأ الغاز بالتكاثف وتتشكل قطرات السائل. وعندما يبلغ السائل درجة حرارة −10°C، يتجمد السائل ليصبح صلبًا. ما درجة غليان هذه المادة؟","options":["a. −10°C","b. 0°C","c. 10°C","d. سنحتاج إلى معلومات إضافية لتحديد ذلك."],"solutions":[{"title":"الإجابة الصحيحة: (c) 10°C","answer":"10°C","explain":"درجة التكاثف تساوي درجة الغليان للمادة عند الضغط نفسه؛ لذلك فدرجة الغليان هي 10°C. أمّا −10°C فهي درجة تجمد المادة."}]},{"n":2,"page":62,"kind":"سؤال","text":"أي الحالتين أكثر تغيرًا في درجة الحرارة: التغير بمقدار 1°F أم التغير بمقدار 1°C؟","options":["a. التغير في درجة الحرارة بمقدار 1°F أكبر من التغير بمقدار 1°C.","b. التغير في درجة الحرارة بمقدار 1°F أقل من التغير بمقدار 1°C.","c. التغير بمقدار 1°F يساوي التغير بمقدار 1°C.","d. يعتمد التغير على ما إذا كانت درجة الحرارة فوق درجة تجمد الماء."],"solutions":[{"title":"الإجابة الصحيحة: (b)","steps":[["العلاقات","T_F = (9/5) T_C + 32"],["الحل","عند زيادة T_C من 0°C إلى 1°C، تتغير T_F من 32°F إلى 33.8°F."]],"answer":"1°C أكبر من 1°F","explain":"درجة سيليزية واحدة في مقدار التغير تعادل 1.8 درجة فهرنهايت. نستنتج ذلك من القانون (2-2) الذي أرسلتِه، دون إضافة قانون آخر."}]}],"63":[{"n":3,"page":63,"kind":"سؤال","text":"أي من درجات الحرارة الآتية هي الدرجة الأبرد؟","options":["a. 60.0°C","b. 149°F","c. 162°F","d. 328K"],"solutions":[{"title":"الإجابة الصحيحة: (d) 328 K","steps":[["العلاقات","T_C = (5/9)(T_F − 32)    ،    T_K = T_C + 273.15"],["الحل","328 K ⟶ 54.85°C ؛ 149°F ⟶ 65°C ؛ 162°F ⟶ 72.22°C"]],"answer":"328 K (نحو 54.85°C)","explain":"توحيد المقياس يساعد على المقارنة: 149°F = 65°C، و162°F ≈ 72.22°C، و328 K = 54.85°C، لذا القراءة الأخيرة هي الأقل."}]},{"n":4,"page":63,"kind":"سؤال","text":"يقوم أحد الطلاب بتبريد غاز مجهول. عندما يبلغ الغاز درجة حرارة 19°C، يبدأ الغاز بالتكاثف وتتشكل قطرات السائل. وعندما يبلغ السائل درجة حرارة −42°C، يتجمد السائل ليصبح صلبًا. ما درجة انصهار هذه المادة؟","options":["a. 61°C","b. 0°C","c. −42°C","d. 19°C"],"solutions":[{"title":"الإجابة الصحيحة: (c) −42°C","answer":"−42°C","explain":"درجة الانصهار تساوي درجة التجمد عند الضغط نفسه؛ تجمد السائل عند −42°C، فتكون هذه درجة انصهاره. أمّا 19°C فهي درجة تكاثفه/غليانه."}]},{"n":5,"page":63,"kind":"سؤال","text":"أي من العناصر الآتية يمتلك السعة الحرارية الأعلى؟","options":["a. الجزيئات القطبية الخفيفة في الحالة الغازية.","b. الجزيئات القطبية الخفيفة في الحالة السائلة.","c. الفلزات الثقيلة في الحالة الصلبة.","d. الفلزات الثقيلة في الحالة السائلة."],"solutions":[{"title":"الإجابة المتوقعة: (b)","answer":"الجزيئات القطبية الخفيفة في الحالة السائلة","explain":"غالبًا ما تتميز السوائل الجزيئية القطبية الخفيفة، مثل الماء، بسعة حرارية نوعية مرتفعة مقارنة بالفلزات. للمقارنة الدقيقة للسعة الحرارية الكلية يجب تحديد كتلة العينات؛ فالكتلة تؤثر فيها."}]}],"64":[{"n":7,"page":64,"kind":"سؤال","text":"أي من درجتي الحرارة الآتيتين تُعد الأسخن، 40°C أم 100°F؟","solutions":[{"title":"الإجابة: 40°C هي الأسخن","steps":[["المطلوب","تحديد درجة الحرارة الأعلى"],["المعطيات","40°C ، 100°F"],["العلاقات","T_F = (9/5) T_C + 32"],["الحل","T_F = (9/5) × 40 + 32 = 104°F"]],"answer":"40°C = 104°F، وهي أعلى من 100°F.","explain":"نحول درجة الحرارة الأولى إلى فهرنهايت بالقانون المرسل من الكتاب؛ 104°F أعلى من 100°F."}]},{"n":8,"page":64,"kind":"سؤال","text":"طلب منك معلّم الفيزياء تسخين مادة إلى أن تبلغ درجة حرارة 165°F. كم ستكون قراءة مقياس درجة الحرارة هذه وفق المقياس السيليزي؟","solutions":[{"title":"التحويل من الفهرنهايت إلى السيليزي","steps":[["المطلوب","T_C"],["المعطيات","T_F = 165°F"],["العلاقات","T_C = (5/9)(T_F − 32)"],["الحل","T_C = (5/9)(165 − 32) = (5/9) × 133 ≈ 73.89°C"]],"answer":"T_C ≈ 73.89°C","explain":"نطرح 32 من قراءة فهرنهايت، ثم نضرب الناتج في الكسر العمودي 5 فوق 9."}]},{"n":9,"page":64,"kind":"سؤال","text":"سُجّلت درجة حرارة مساء أحد الأيام 20°C، لترتفع وتصبح في اليوم التالي 25°C؛ وبناءً على ذلك أجب عما يأتي:","parts":[{"id":"a","text":"كم يبلغ ارتفاع درجة الحرارة اليوم التالي بوحدة الكلفن؟"},{"id":"b","te const SITE_URL='https://hafsa-hub-dot.github.io/student/heat-lab-grade10/';
let stage='home',selectedPage=47,activeQuestion=0,activePart=0,detailTab='question';
const PAGES=[
 {number:47,count:12,label:'تقويم الدرس 1-2',topics:['درجة الحرارة والطاقة الحرارية','انتقال الحرارة وتفسير الظواهر','مقارنة مقاييس درجة الحرارة','التحويلات بين السيليزي والفهرنهايت والكلفن']},
 {number:62,count:2,label:'تقويم الوحدة',topics:['درجتا الغليان والتكاثف','المقارنة بين مقدار التغير في المقياسين']},
 {number:63,count:3,label:'تقويم الوحدة',topics:['المقارنة بين درجات الحرارة','درجة الانصهار والتجمد','السعة الحرارية']},
 {number:64,count:5,label:'تقويم الوحدة',topics:['التحويل بين مقاييس الحرارة','التغير في درجة الحرارة','صحة تدوين درجات الحرارة','اتجاه انتقال الحرارة والاتزان الحراري']}
];
const dataForPage=p=>p===47?Q:(ADDITIONAL[p]||[]);
const supportFor=q=>selectedPage===47?SUPPORT[q.n]:(q.image?{title:'الشكل 24-2',lead:'الرسم كما ورد في الصورة التي أرسلتموها من الكتاب.',image:q.image}:null);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
// Display textbook ratios as true stacked fractions, never slash-style text.
const m=s=>esc(s).replace(/(\d+)\s*\/\s*(\d+)/g,(_,n,d)=>`<span class="vfrac" role="math" aria-label="${n} على ${d}"><span class="vnum">${n}</span><span class="vden">${d}</span></span>`).replace(/T_([CFK])/g,'T<sub>$1</sub>');
const fmt=s=>esc(s).replace(/([−-]?\d+(?:\.\d+)?\s*(?:°[CF]|K|°))/g,'<bdi dir="ltr">$1</bdi>');
const btn=(txt,onclick,cls='mainBtn')=>`<button type="button" class="${cls}" onclick="${onclick}">${txt}</button>`;
const current=()=>dataForPage(selectedPage)[activeQuestion];
function go(s){stage=s;render();}
function selectPage(p){selectedPage=p;activeQuestion=0;activePart=0;stage='overview';render()}
function openPage(){stage='grid';render()}
function selectQuestion(i){activeQuestion=i;activePart=0;detailTab='question';stage='detail';render()}
function tab(s){detailTab=s;render()}
function branch(i){activePart=i;detailTab='answer';render()}
function layout(title,right=''){return `<div class="pageHeading"><h1 class="pageTitle">${title}</h1>${right}</div>`}
function home(){return `<section class="view"><div class="homeCard"><div class="homeMark" aria-hidden="true">فيـ</div><div class="smallCap">مبادرة علمية تطوعية • الفيزياء • المستوى العاشر</div><h1>أهلًا بكم في <em>حل مسائل كتاب الفيزياء</em></h1><p class="welcomeText">طلبتنا الأعزاء، هنا ننتقل من قراءة السؤال إلى فهم المطلوب، واختيار قانون الكتاب المناسب، ثم الوصول إلى الحل بخطوات واضحة. اختاروا صفحة الكتاب أولًا، ثم السؤال الذي ترغبون في حلّه.</p><p class="dedication">هذا العمل مبادرة تعليمية تطوعية أُعدّت ابتغاء وجه الله تعالى، رغبةً في تيسير العلم ونفع طلبتنا.</p><p class="prayer">اللهم افتح لطلبتنا أبواب الفهم، ويسّر لهم العلم، وبارك في جهودهم، ووفّقهم لكل خير ونجاح.</p><div class="author">إعداد معلمة الفيزياء حفصة طيبي</div><div class="homeActions">${btn('التالي ← فهرس صفحات الكتاب',"go('pages')",'mainBtn teal')}</div></div></section>`}
function pages(){return `<section class="view">${layout('فهرس صفحات الكتاب','<p>اختاروا رقم الصفحة للاطلاع على موضوعاتها أولًا</p>')}<div class="pagesGrid">${PAGES.map(p=>`<button class="pageCard" onclick="selectPage(${p.number})" aria-label="فتح صفحة الكتاب ${p.number}"><span class="pageNum">${p.number}</span><strong>صفحة الكتاب ${p.number}</strong><small>${p.count===2?'سؤالان':p.count>2&&p.count<11?p.count+' أسئلة':p.count+' سؤالًا'}</small><span class="goText">الاطلاع على الموضوعات ←</span></button>`).join('')}</div><div class="navFoot"><p>الصفحات المضافة مأخوذة من الصور التي أرسلتموها فقط.</p>${btn('العودة إلى الترحيب',"go('home')",'ghostBtn')}${btn('طباعة الحلول PDF',"printMode(false)",'ghostBtn')}</div></section>`}
function overview(){let p=PAGES.find(x=>x.number===selectedPage);return `<section class="view"><div class="overview"><div class="pagePill">صفحة الكتاب ${p.number}</div><div class="smallCap">ماذا سنتعلم في هذه الصفحة؟</div><h2>موضوعات ${esc(p.label)}</h2><div class="topics">${p.topics.map(t=>`<h3 class="topic">${esc(t)}</h3>`).join('')}</div><p class="overviewInfo">تتضمن الصفحة ${p.count} من الأسئلة الظاهرة في صور الكتاب. اختاروا السؤال المطلوب دون انتقال مباشر بين الأسئلة.</p><div class="homeActions">${btn('استمرار ← عرض مربعات الأسئلة',"openPage()",'mainBtn teal')}${btn('العودة إلى فهرس الصفحات',"go('pages')",'ghostBtn')}</div></div></section>`}
function grid(){let p=selectedPage,arr=dataForPage(p);let colors=['teal','wine','blue','orange','purple','green'];let rows=Math.max(1,Math.ceil(arr.length/3));return `<section class="view">${layout(`اختر رقم السؤال • ص ${p}`,'<p>كل مربع يفتح سؤاله بصورة مستقلة</p>')}<div class="tiles" style="grid-template-rows:repeat(${rows},minmax(0,1fr))">${arr.map((q,i)=>`<button type="button" class="tile ${colors[i%colors.length]}" onclick="selectQuestion(${i})" aria-label="سؤال ${q.n} من صفحة الكتاب ${p}"><strong>س ${q.n}</strong><small>ص ${p}</small></button>`).join('')}</div><div class="navFoot"><p>لا يوجد انتقال مباشر بين الأسئلة. عودوا إلى المربعات لاختيار سؤال آخر.</p>${btn('صفحات الكتاب',"go('pages')",'ghostBtn')}</div></section>`}
function topDetail(q){return `<div class="detailHead"><h2>س ${q.n} <span style="color:#638184">•</span> ص ${selectedPage}</h2><div class="returnActions"><button class="thinBtn" onclick="go('grid')">مربعات الأسئلة</button><button class="thinBtn wine" onclick="go('home')">الرئيسية</button></div></div>`}
function questionContent(q){let options=q.options?`<div class="options">${q.options.map(x=>`<div class="qOption">${fmt(x)}</div>`).join('')}</div>`:'';
let branches=q.parts?`<div class="partRows">${q.parts.map(p=>`<div class="partRow"><strong>(${esc(p.id)})</strong>${fmt(p.text)}</div>`).join('')}</div>`:'';
return `<div class="questionPanel"><div class="detailCap">${'السؤال '+q.n+' من '+(selectedPage===47?'تقويم الدرس 1-2':'تقويم الوحدة')} • صفحة الكتاب ${selectedPage}</div><h3 class="detailText ${[5,9,12].includes(q.n)&&selectedPage===47?'dense':''}">${fmt(q.text)}</h3>${options}${branches}${q.image?`<div class="figureQuestion"><img src="${q.image}" alt="الشكل 24-2 من الكتاب"></div>`:''}</div>`}
function answerContent(q){let sol=q.solutions[activePart]||q.solutions[0];let parts=q.solutions.length>1?`<div class="partTabs">${q.solutions.map((s,i)=>`<button class="partTab ${i===activePart?'active':''}" onclick="branch(${i})">الفرع (${esc(s.id)})</button>`).join('')}</div>`:'';
let steps=sol.steps?`<div class="steps">${sol.steps.map(([key,val])=>`<div class="step"><div class="stepLabel">${esc(key)}</div><div class="stepValue ${['المعطيات','العلاقات','الحل'].includes(key)?'formula':''}">${m(val)}</div></div>`).join('')}</div>`:'';
return `<div class="answerPanel"><div class="answerTitle">${esc(sol.title)}</div>${parts}${steps}${sol.answer?`<div class="answerResult">${m(sol.answer)}</div>`:''}${sol.explain?`<p class="explanation">${m(sol.explain)}</p>`:''}</div>`}
function supportContent(q){let s=supportFor(q);if(!s)return `<div class="supportView"><h3>توضيح علمي</h3><p>يُرجى مراجعة الشرح في الإجابة النموذجية.</p></div>`;let media=s.svg?`<div class="supportMedia">${s.svg}</div>`:s.image?`<div class="supportMedia"><img src="${s.image}" alt="${esc(s.title)}"></div>`:'';let table=s.columns?`<table><thead><tr>${s.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(row=>`<tr>${row.map(x=>`<td>${fmt(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'';return `<div class="supportView"><h3>${esc(s.title)}</h3>${media}${table}<p>${esc(s.lead||'')}</p></div>`}
function explainContent(q){let s=q.solutions[activePart]||q.solutions[0];return `<div class="supportView"><h3>تفسير الإجابة</h3><div class="simpleNote">${m(s.explain||'يمكن الرجوع إلى الحل النموذجي.')}</div></div>`}

if(ri===1)return {caption:'الجولة 2 • اكتشفي المصطلح',prompt:`أيُّ مصطلح يناسب هذا التعريف؟<br><span style="color:#6d5597">${safe(item.def)}</span>`,answer:item.term,options:[item.term,...shuffle(concepts.filter(c=>c.term!==item.term).map(c=>c.term),index).slice(0,3)],hint:'انتبهي للفرق بين الكمية والطاقة المنتقلة.'};
if(ri===2)return {caption:'الجولة 3 • اختاري المثال',prompt:`أي عبارة تطبق مفهوم «${item.term}» بدقة؟`,answer:item.example,options:[item.example,...shuffle(concepts.filter(c=>c.term!==item.term).map(c=>c.example),index).slice(0,3)],hint:'فكري في التعريف الذي رأيته وراء الستارة.'};
return {caption:'الجولة 4 • الموقف الحقيقي',prompt:safe(item.context),answer:item.app,options:item.apps,hint:'اربطي الحالة بما يحدث للجسيمات أو اتجاه انتقال الحرارة.'};}
if(ri===0)return {caption:'الجولة 1 • الرمز الناقص',prompt:`أكملي القانون:<br><span class="formula">${safe(item.blank)}</span>`,answer:item.key,options:item.opts,hint:item.hint};
if(ri===1)return {caption:'الجولة 2 • اتجاه التحويل',prompt:`ماذا يحوّل هذا القانون؟<br><span class="formula">${item.symbol}</span>`,answer:item.label,options:shuffle(laws.map(l=>l.label),index),hint:'انظري إلى الرمز وحدته في الطرف الأيسر.'};
if(ri===2)return {caption:'الجولة 3 • اختاري القانون الصحيح',prompt:`اختاري الصيغة الصحيحة لـ «${safe(item.term)}»`,answer:item.plain,options:shuffle(laws.map(l=>l.plain),index),hint:'تذكّري إشارة الجمع أو الطرح والكسر المناسب.'};
return {caption:'الجولة 4 • تثبيت بالتطبيق',prompt:safe(item.context),answer:item.app,options:item.apps,hint:item.hint};}

let tab='home',ci=0,li=0,cardOpen=false,gi=0,round=0,choice='',correct=false,pi=0,ps=0,mastery={};
try{mastery=JSON.parse(localStorage.getItem('heat_review_mastery_v2')||'{}')}catch(e){mastery={}}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('heat_review_mastery_v2',JSON.stringify(mastery))}catch(e){}}
function navHTML(){for(const id of ['deskNav','mobNav'])$(id).innerHTML=navs.map(([t,name])=>`<button class="navBtn ${tab===t?'on':''}" data-tab="${t}" onclick="go('${t}')" aria-current="${tab===t?'page':'false'}">${name}</button>`).join('')}
function go(t){tab=t;choice='';correct=false;cardOpen=false;navHTML();render()}
function page(heading,count,interior,cls=''){return `<section class="page"><div class="pageHeading"><h1 class="pageTitle">${heading}</h1><div class="count">${count}</div></div><div class="sheet ${cls}">${interior}</div></section>`}
function render(){navHTML();if(tab==='home')return home();if(tab==='concepts'||tab==='laws')return card();if(tab==='game')return game();if(tab==='problems')return problem()}
function home(){const done=Object.values(mastery).filter(Boolean).length; $('stage').innerHTML=page('الدرس 1-2 · مراجعة تفاعلية',`${done} من ${ALL.length} بطاقة متقنة`,`<div class="sheetPad homeSheet"><div class="homeIntro"><div class="kicker">مراجعة هادئة ومنظّمة</div><div class="rule"></div><h2 class="primaryTitle">درجة الحرارة <br> والحرارة</h2><p class="desc">افهمي المفهوم أولًا، ثم ثبّتي التعريف والقانون بأربع تدريبات، وبعدها انتقلي إلى مسائل الكتاب خطوة بخطوة.</p><div class="actions"><button class="btn btnPrimary" onclick="go('concepts')">ابدئي بالمفاهيم <span aria-hidden="true">←</span></button><button class="btn btnOutline" onclick="go('problems')">انتقلي إلى المسائل</button></div></div><div class="homeSteps"><div class="homeStep"><span class="stepNo">01</span><div class="stepTxt"><b>الفهم</b><span>مفهوم وتعريف</span></div></div><div class="homeStep"><span class="stepNo">02</span><div class="stepTxt"><b>التثبيت</b><span>4 جولات للحفظ</span></div></div><div class="homeStep"><span class="stepNo">03</span><div class="stepTxt"><b>التطبيق</b><span>مسائل الكتاب</span></div></div></div></div>`,'homeSheet')}
function moveCard(d){if(tab==='concepts')ci=(ci+d+concepts.length)%concepts.length;else li=(li+d+laws.length)%laws.length;cardOpen=false;card()}
function reveal(){cardOpen=true;card()}
function toGameForCard(){gi=tab==='concepts'?ci:concepts.length+li;round=0;choice='';correct=false;go('game')}
function card(){const isLaw=tab==='laws',arr=isLaw?laws:concepts,idx=isLaw?li:ci,o=arr[idx];let learned=isLaw?`<div class="formula">${o.symbol}</div><div class="hint">${safe(o.hint)}</div>`:`<div class="definition">${safe(o.def)}</div><div class="hint">مثال تطبيقي: ${safe(o.example)}</div>`;let body=`<div class="cardSheet sheetPad"><div class="cardCap">${isLaw?'قانون من الكتاب المدرسي':'مفهوم أساسي'}</div><h2 class="cardTerm">${safe(o.term)}</h2><div class="cardCenter"><div class="curtain ${cardOpen?'open':''}"><div class="closedText"><strong>${isLaw?'استحضري صيغة القانون':'حاولي تذكّر التعريف'}</strong><span>فكري أولًا، ثم اكشفي المحتوى للتحقق</span></div><div class="revealed">${learned}</div></div></div><div class="bottomRow"><button class="btn btnOutline sideBtn" onclick="moveCard(-1)">السابق</button><button class="btn btnPrimary cardPrimaryBtn" onclick="${cardOpen?'toGameForCard()':'reveal()'}">${cardOpen?'اختبري الحفظ ←':'اكشفي '+(isLaw?'القانون':'التعريف')}</button><button class="btn btnOutline sideBtn" onclick="moveCard(1)">التالي</button></div></div>`;$('stage').innerHTML=page(isLaw?'مراجعة القوانين':'مراجعة المفاهيم',`البطاقة ${idx+1} من ${arr.length}`,body)}
function game(){const item=ALL[gi],q=getRound(item,gi,round),choices=shuffle(q.options,round*97+gi*173+13);let answer=q.answer;let buttons=choices.map((x,i)=>`<button class="choice ${choice===x?(correct?'good':'bad'):''}" ${correct?'disabled':''} onclick="answerGame(${JSON.stringify(x).replace(/"/g,'&quot;')})">${safe(x)}</button>`).join('');let help=correct?'إجابة صحيحة. أحسنتِ؛ يمكنك الانتقال الآن.':choice?`إجابة غير صحيحة. حاولي مجددًا. ${safe(q.hint||'')}`:'اختاري إجابة واحدة من البدائل.';let dots=[0,1,2,3].map(i=>`<span class="${i<=round?'done':''}"></span>`).join('');let body=`<div class="quizSheet sheetPad"><div class="quizMeta"><div class="quizRound">${safe(item.term)} · الجولة ${round+1} من 4</div><div class="progressDots" aria-label="تقدم الجولات">${dots}</div></div><div class="questionArea"><div class="questionSmall">${safe(q.caption)}</div><div class="questionText">${q.prompt}</div></div><div class="choices">${buttons}</div><div class="gameBottom"><span class="response ${correct?'ok':choice?'no':''}">${help}</span><button class="btn btnPrimary btnSmall" ${correct?'':'disabled'} onclick="nextGame()">${round===3?'إنهاء البطاقة':'السؤال التالي'} ←</button></div></div>`;$('stage').innerHTML=page('تدريب الحفظ',`البطاقة ${gi+1} من ${ALL.length}`,body)}
function answerGame(v){if(correct)return;choice=v;correct=v===getRound(ALL[gi],gi,round).answer;game()}
function nextGame(){if(!correct)return;if(round<3){round++;choice='';correct=false;game();return}mastery[gi]=true;save();if(gi<ALL.length-1){gi++;round=0;choice='';correct=false;game()}else{go('problems')}}
function problem(){const q=questions[pi],book=q.n==='مثال 1'?'صفحة الكتاب 46':'صفحة الكتاب 47',ref=q.n==='مثال 1'?'مثال 1':`السؤال ${q.n}`;let order=['المطلوب','القانون','التعويض','الحل'];let steps=`<div class="steps">${order.map((x,i)=>`<span class="${i===ps?'active':i<ps?'done':''}">${x}</span>`).join('')}</div>`;let statement=`<div class="problemBox"><div class="problemLabel">${safe(ref)} · ${book}</div><div class="problemName">${safe(q.name)}</div><div class="problemStory">${safe(q.story)}</div></div>`;let extra='';if(ps===3){extra=`<div class="worked"><div class="workRow"><span class="workLabel">المطلوب</span><span class="workVal">${safe(q.targetName)}</span></div><div class="workRow"><span class="workLabel">المعطيات</span><span class="workVal math" dir="ltr">${safe(q.given)}</span></div><div class="workRow"><span class="workLabel">العلاقات</span><span class="workVal math" dir="ltr">${safe(q.law)}</span></div><div class="workRow"><span class="workLabel">بالتعويض</span><span class="workVal math" dir="ltr">${safe(q.sub)}</span></div><div class="workRow"><span class="workLabel">الإجابة</span><span class="workVal math" dir="ltr">${safe(q.result)}</span></div><div class="workNote">${safe(q.note)}</div></div>`}else{const modes=[{caption:'اقرئي نص المسألة: ما المطلوب حسابه؟',opts:q.targetOpts,ans:q.targetName},{caption:'أي قانون مناسب لهذا التحويل؟',opts:q.lawOpts,ans:q.law},{caption:'اختاري الناتج الصحيح بعد التعويض.',opts:q.answers,ans:q.result.split(' ≈ ').pop()}],m=modes[ps];let opts=shuffle(m.opts,pi*67+ps*19).map(x=>`<button class="choice ${choice===x?(correct?'good':'bad'):''}" ${correct?'disabled':''} onclick="answerProblem(${JSON.stringify(x).replace(/"/g,'&quot;')})">${safe(x)}</button>`).join('');extra=`<div class="questionArea"><div class="questionSmall">${safe(q.given)}</div><div class="questionText">${m.caption}</div></div><div class="choices three">${opts}</div><div class="gameBottom"><span class="response ${correct?'ok':choice?'no':''}">${correct?'صحيح. انتقلي إلى الخطوة التالية.':choice?'راجعي السؤال ثم حاولي مرة أخرى.':'اختاري الإجابة المناسبة.'}</span><button class="btn btnPrimary btnSmall" ${correct?'':'disabled'} onclick="nextProblemStep()">${ps===2?'عرض الحل الكامل':'التالي'} ←</button></div>`}let bod=`<div class="quizSheet sheetPad">${statement}${steps}${extra}${ps===3?`<div class="bottomRow"><button class="btn btnOutline btnSmall" onclick="moveProblem(-1)">مسألة سابقة</button><button class="btn btnPrimary btnSmall" onclick="moveProblem(1)">المسألة التالية ←</button></div>`:''}</div>`;$('stage').innerHTML=page('حل المسائل خطوة بخطوة',`${pi+1} من ${questions.length}`,bod)}
function answerProblem(v){if(correct)return;const q=questions[pi];let m=ps===0?q.targetName:ps===1?q.law:q.result.split(' ≈ ').pop();choice=v;correct=v===m;problem()}
function nextProblemStep(){if(!correct)return;ps++;choice='';correct=false;problem()}
function moveProblem(d){pi=(pi+d+questions.length)%questions.length;ps=0;choice='';correct=false;problem()}
function openShare(){$('shareDialog').classList.add('open')}
function closeShare(){$('shareDialog').classList.remove('open')}
$('shareDialog').addEventListener('click',e=>{if(e.target===$('shareDialog'))closeShare()});
function copyLink(){const value=URL;try{navigator.clipboard?.writeText(value);$('shareNotice').textContent='تم نسخ الرابط.'}catch(e){$('shareNotice').textContent=value}}
function toggleFull(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeShare();if(e.target.tagName==='INPUT')return;if(tab==='concepts'||tab==='laws'){if(e.key==='ArrowLeft')moveCard(1);if(e.key==='ArrowRight')moveCard(-1)}else if(tab==='problems'&&ps===3){if(e.key==='ArrowLeft')moveProblem(1);if(e.key==='ArrowRight')moveProblem(-1)}});
function printAll(){document.body.classList.remove('printExerciseMode');closeShare();window.print()}
function printExercises(){document.body.classList.add('printExerciseMode');closeShare();window.print()}
window.addEventListener('afterprint',()=>document.body.classList.remove('printExerciseMode'));
function bookLabel(q){return q.n==='مثال 1'?'مثال 1 — صفحة 46':'السؤال '+safe(q.n)+' — صفحة 47'}
function printPack(){const c=(a,b)=>a.map((x,i)=>`<article class="printItem"><div class="printNum">${b} ${i+1}</div><h3>${safe(x.term)}</h3><p>${safe(x.def||x.hint)}</p>${x.symbol?`<div class="printF">${x.symbol}</div>`:''}${x.example?`<p>مثال: ${safe(x.example)}</p>`:''}</article>`).join('');$('printPack').innerHTML=`<div class="printCover"><div class="sch">مدرسة العب الثانوية للبنات · قسم الفيزياء</div><h1>مراجعة درجة الحرارة والحرارة</h1><div class="info">فيزياء الصف العاشر · الدرس 1-2</div><p>اسم الطالبة: ....................................... &nbsp; الشعبة: ..................</p><p>إعداد معلمة الفيزياء: حفصة طيبي</p></div><h2 class="printSection">أولًا: المفاهيم الأساسية</h2>${c(concepts,'مفهوم')}<h2 class="printSection">ثانيًا: قوانين تحويل درجة الحرارة</h2>${c(laws,'قانون')}<h2 class="printSection">ثالثًا: تدريبات الحفظ</h2>${ALL.map((x,i)=>`<article class="printItem"><h3>البطاقة ${i+1} — ${safe(x.term)}</h3>${[0,1,2,3].map(r=>{let q=getRound(x,i,r);return `<div class="printQA"><strong>الجولة ${r+1}:</strong> ${String(q.prompt).replace(/<br\s*\/?\s*>/g,' — ').replace(/<[^>]*>/g,'')}<div class="ans">الإجابة: <b>${safe(q.answer)}</b></div></div>`}).join('')}</article>`).join('')}<h2 class="printSection">رابعًا: المسائل المحلولة</h2>${questions.map(q=>`<article class="printProblem"><div class="qnum">${bookLabel(q)} · ${safe(q.name)}</div><div class="qstory">${safe(q.story)}</div><div class="printR"><b>المطلوب</b><span>${safe(q.targetName)}</span></div><div class="printR"><b>المعطيات</b><span dir="ltr">${safe(q.given)}</span></div><div class="printR"><b>العلاقات</b><span dir="ltr">${safe(q.law)}</span></div><div class="printR"><b>التعويض</b><span dir="ltr">${safe(q.sub)}</span></div><div class="printR"><b>الإجابة</b><span dir="ltr">${safe(q.result)}</span></div><div class="note"><b>تفسير:</b> ${safe(q.note)}</div></article>`).join('')}<h2 class="printSection">خامسًا: الإجابات المفاهيمية لتقويم الدرس</h2>${conceptReview.map(q=>`<article class="printItem"><div class="printNum">السؤال ${q[0]} — صفحة 47</div><h3>${safe(q[1])}</h3><p>${safe(q[2])}</p></article>`).join('')}<div class="printEnd">مدرسة العب الثانوية للبنات · قسم الفيزياء · إعداد: حفصة طيبي</div>`}
printPack();render();
</script>
</body></html>

const Q = [{"n": 1, "text": "ماذا يحدث لدرجة الحرارة عندما تتحرك الجسيمات بشكل أسرع؟", "options": ["a. ترتفع درجة الحرارة", "b. تنخفض درجة الحرارة", "c. تبقى درجة الحرارة من دون تغيير", "d. لا يمكن قياس درجة الحرارة"], "solutions": [{"title": "الإجابة النموذجية", "answer": "a. ترتفع درجة الحرارة.", "explain": "تزداد سرعة حركة الجسيمات العشوائية، فيزداد متوسط طاقتها الحركية، وبالتالي ترتفع درجة الحرارة."}]}, {"n": 2, "text": "عرّف الطاقة الحرارية.", "solutions": [{"title": "الإجابة النموذجية", "answer": "الطاقة الحرارية هي مجموع الطاقة الحركية وطاقة الوضع لجسيمات المادة.", "explain": "تمتلك الجسيمات طاقة حركية نتيجة حركتها، وطاقة وضع نتيجة التفاعلات بينها."}]}, {"n": 3, "text": "صف كيف يرتبط تدفق الحرارة بدرجة الحرارة.", "solutions": [{"title": "الإجابة النموذجية", "answer": "تنتقل الحرارة تلقائيًا من الجسم الأعلى درجة حرارة إلى الجسم الأقل درجة حرارة.", "explain": "يسبب فرق درجة الحرارة انتقال الطاقة، ويستمر ذلك حتى يصل الجسمان إلى الاتزان الحراري."}]}, {"n": 4, "text": "ما الفرق بين درجة الحرارة والحرارة؟", "solutions": [{"title": "الإجابة النموذجية", "answer": "درجة الحرارة مقياس لمتوسط الطاقة الحركية لجسيمات المادة، أما الحرارة فهي طاقة تنتقل بين الأجسام نتيجة فرق درجات الحرارة.", "explain": "تقاس درجة الحرارة بـ °C أو K أو °F؛ وتقاس الطاقة الحرارية المنتقلة بالجول (J)."}]}, {"n": 5, "text": "قام أحد سياح مدينة الدوحة بضبط ترموستات غرفته في الفندق على 68°. لم يدرك السائح أن الترموستات يعمل بمقياس درجة سيليزي بدلًا من فهرنهايت.", "parts": [{"id": "a", "text": "هل ستصبح غرفة الفندق ساخنة، أم باردة، أم مناسبة، بعد مرور ساعة أو ساعتين؟"}, {"id": "b", "text": "حوّل درجة الحرارة التي ضبط عليها الترموستات إلى وحدة الفهرنهايت."}], "solutions": [{"id": "a", "title": "الفرع (a) — تفسير", "answer": "ستصبح الغرفة ساخنة جدًا إذا استطاع نظام التدفئة الوصول إلى 68°C.", "explain": "68°C درجة مرتفعة للغاية، بينما 68°F تساوي 20°C تقريبًا، وهي درجة مناسبة للغرفة."}, {"id": "b", "title": "الفرع (b) — التحويل", "steps": [["المطلوب", "درجة الحرارة بالفهرنهايت T_F"], ["المعطيات", "T_C = 68°C"], ["العلاقات", "T_F = (9/5) T_C + 32"], ["الحل", "T_F = (9/5) × 68 + 32 = 122.4 + 32"]], "answer": "T_F = 154.4°F", "explain": "نضرب درجة السيليزي في 9/5 ثم نضيف 32 وفق قانون الكتاب."}]}, {"n": 6, "text": "كيف تتغير الطاقة الحركية العشوائية للجزيئات عند تسخين دورق ماء؟", "solutions": [{"title": "الإجابة النموذجية", "answer": "تزداد الطاقة الحركية العشوائية لجزيئات الماء.", "explain": "تنتقل الطاقة إلى الماء فتزداد حركة جزيئاته، ويرتفع متوسط طاقتها الحركية مع ارتفاع درجة الحرارة."}]}, {"n": 7, "text": "أيّ من درجتي الحرارة 1°F أم 1°C تمثّل فرقًا أكبر في درجة الحرارة؟", "solutions": [{"title": "الإجابة النموذجية", "answer": "الفرق 1°C أكبر من الفرق 1°F.", "steps": [["العلاقات", "T_F = (9/5) T_C + 32"], ["المقارنة", "0°C تقابل 32°F، و 1°C تقابل 33.8°F. إذن فرق 1°C يقابل فرق 1.8°F."]], "explain": "باستخدام قانون الكتاب من السيليزي إلى الفهرنهايت، نقارن قراءتين متتاليتين بفارق درجة سيليزية واحدة. لا نستخدم قانونًا رابعًا."}]}, {"n": 8, "text": "ضُبط مكيّف هواء غرفة على وضع التبريد عند درجة حرارة 76°F. حوّل درجة الحرارة تلك إلى درجة سيليزية.", "solutions": [{"title": "الحل وفق قوانين الكتاب", "steps": [["المطلوب", "درجة الحرارة بالسيليزي T_C"], ["المعطيات", "T_F = 76°F"], ["العلاقات", "T_C = (5/9)(T_F − 32)"], ["الحل", "T_C = (5/9)(76 − 32) = (5/9) × 44"]], "answer": "T_C ≈ 24.4°C", "explain": "نطرح 32 من قراءة الفهرنهايت ثم نضرب الناتج في 5/9."}]}, {"n": 9, "text": "سافر سائح من مدينة الدوحة إلى نيويورك، فعلم من التلفاز أن درجة الحرارة في نيويورك 35 درجة، من دون تحديد إن كانت °C أم °F. هل هذه درجة حرارة ساخنة أم باردة على المقياسين؟ اشرح إجابتك.", "solutions": [{"title": "الإجابة والحل", "steps": [["المطلوب", "تحديد ما إذا كانت 35° حارة أم باردة على مقياسي السيليزي والفهرنهايت"], ["المعطيات", "T_F = 35°F عند استخدام الفهرنهايت"], ["العلاقات", "T_C = (5/9)(T_F − 32)"], ["الحل", "T_C = (5/9)(35 − 32) = (5/9) × 3 ≈ 1.7°C"]], "answer": "35°C: حارة. 35°F: باردة (نحو 1.7°C).", "explain": "لا يكفي ذكر العدد 35 من دون الوحدة؛ لأن المقياسين مختلفان."}]}, {"n": 10, "text": "صف حالة يحدث فيها انتقال للحرارة.", "solutions": [{"title": "الإجابة النموذجية", "answer": "عند وضع ملعقة معدنية باردة في كوب شاي ساخن، تنتقل الحرارة من الشاي إلى الملعقة.", "explain": "يحدث انتقال الحرارة بسبب فرق درجة الحرارة. وينتقل جزء من الحرارة خلال الملعقة بالتوصيل الحراري."}]}, {"n": 11, "text": "لماذا يزداد حجم إطارات السيارات بعدما تتحرك السيارة لمسافة طويلة؟", "solutions": [{"title": "الإجابة النموذجية", "answer": "ترتفع درجة حرارة الهواء داخل الإطارات، وقد تتمدد الإطارات قليلًا بسبب مرونتها.", "explain": "خلال السير ترتفع حرارة الإطار والهواء داخله، ويزداد ضغط الهواء أساسًا لأن حجم الإطار شبه ثابت؛ وقد تحدث زيادة صغيرة في حجمه."}]}, {"n": 12, "text": "قم بإجراء التحويلات بين مقاييس درجات الحرارة الآتية:", "parts": [{"id": "a", "text": "حوّل 1000 K إلى °C."}, {"id": "b", "text": "حوّل 72°F إلى °C."}, {"id": "c", "text": "حوّل −10°C إلى K."}, {"id": "d", "text": "حوّل 77 K إلى °C."}], "solutions": [{"id": "a", "title": "الفرع (a) — الكلفن إلى السيليزي", "steps": [["المطلوب", "T_C"], ["المعطيات", "T_K = 1000 K"], ["العلاقات", "T_K = T_C + 273.15"], ["الحل", "T_C = T_K − 273.15 = 1000 − 273.15"]], "answer": "T_C = 726.85°C", "explain": "هذا القانون ناتج من إعادة ترتيب T_K = T_C + 273.15."}, {"id": "b", "title": "الفرع (b) — الفهرنهايت إلى السيليزي", "steps": [["المطلوب", "T_C"], ["المعطيات", "T_F = 72°F"], ["العلاقات", "T_C = (5/9)(T_F − 32)"], ["الحل", "T_C = (5/9)(72 − 32) = (5/9) × 40"]], "answer": "T_C ≈ 22.22°C", "explain": "التقريب إلى منزلة عشرية واحدة يعطي 22.2°C."}, {"id": "c", "title": "الفرع (c) — السيليزي إلى الكلفن", "steps": [["المطلوب", "T_K"], ["المعطيات", "T_C = −10°C"], ["العلاقات", "T_K = T_C + 273.15"], ["الحل", "T_K = −10 + 273.15"]], "answer": "T_K = 263.15 K", "explain": "وحدة الكلفن K لا تكتب معها علامة الدرجة °."}, {"id": "d", "title": "الفرع (d) — الكلفن إلى السيليزي", "steps": [["المطلوب", "T_C"], ["المعطيات", "T_K = 77 K"], ["العلاقات", "T_K = T_C + 273.15"], ["الحل", "T_C = T_K − 273.15 = 77 − 273.15"]], "answer": "T_C = −196.15°C", "explain": "الناتج سالب لأن 77 K أقل من 273.15 K."}]}];

let index=0,view='home',part=0;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const math=s=>esc(s).replace(/T_([CFK])/g,'T<sub>$1</sub>').replace(/ΔT_([CFK])/g,'ΔT<sub>$1</sub>');
const qfmt=s=>esc(s).replace(/([−-]?\d+(?:\.\d+)?\s*(?:°[CF]|K|°))/g,'<bdi dir=\"ltr\">$1</bdi>');
function button(label,fn,cls='primary'){return `<button type="button" class="${cls}" onclick="${fn}">${label}</button>`}
function show(v){view=v;render()}
function jump(i){index=Math.max(0,Math.min(Q.length-1,i));part=0;view='question';render()}
function answer(i){part=i||0;view='answer';render()}
function home(){return `<section class="screen"><div class="hero"><div class="smalltop">الفيزياء • الصف العاشر</div><div class="line"></div><h1>حل تقويم الدرس <bdi dir="ltr">1-2</bdi></h1><div class="subtitle">درجة الحرارة والحرارة</div><div class="bookinfo">أسئلة الكتاب المدرسي • صفحة 47</div><div class="heroActions">${button('ابدئي حل التقويم ←',"jump(0)")}${button('عرض الباركود',"show('qr')",'outline')}</div></div></section>`}
function question(){let q=Q[index],letter=q.parts||[];let extra=q.options?`<div class="choiceList">${q.options.map(x=>`<div class="choiceItem">${esc(x)}</div>`).join('')}</div>`:letter.length?`<div class="parts">${letter.map(p=>`<div class="part"><span class="partmark">${esc(p.id)}</span><span>${qfmt(p.text)}</span></div>`).join('')}</div>`:'';
return `<section class="screen"><div class="meta"><div class="metaTitle">تقويم الدرس <bdi dir="ltr">1-2</bdi></div><div class="pageno">صفحة الكتاب 47</div></div><article class="paper"><div class="paperline"></div><div class="paperInner"><div class="questionCap">السؤال ${q.n} من 12</div><div class="questionBox ${q.n===9||q.n===12?'long':''}"><h2 class="questionText">${qfmt(q.text)}</h2>${extra}</div><div class="questionFooter">${button('عرض الإجابة والحل',"answer(0)")}</div></div></article><div class="pager"><button class="pageBtn" onclick="jump(${index-1})" ${index===0?'disabled':''}>السؤال السابق</button><div class="counter">${index+1} / ${Q.length}</div><button class="pageBtn" onclick="jump(${index+1})" ${index===Q.length-1?'disabled':''}>السؤال التالي</button></div></section>`}
function ans(){let q=Q[index],sol=q.solutions[part]||q.solutions[0],tabs=q.solutions.length>1?`<div class="partTabs">${q.solutions.map((p,i)=>`<button class="tab ${part===i?'active':''}" onclick="answer(${i})">الفرع (${esc(p.id)})</button>`).join('')}</div>`:'';
let steps=sol.steps?`<div class="steps">${sol.steps.map(([a,b])=>`<div class="step"><div class="stepLabel">${esc(a)}</div><div class="stepVal ${a==='العلاقات'||a==='المعطيات'||a==='الحل'?'formula':''}">${math(b)}</div></div>`).join('')}</div>`:'';
return `<section class="screen"><div class="meta"><div class="metaTitle">السؤال ${q.n} • الإجابة النموذجية</div><div class="pageno">صفحة الكتاب 47</div></div><article class="paper"><div class="paperline"></div><div class="paperInner answerMode"><div class="answerHeader"><div class="answerTitle">${esc(sol.title)}</div>${tabs}</div><div class="answerContent">${steps}${sol.answer?`<div class="answerLead">${math(sol.answer)}</div>`:''}${sol.explain?`<div class="explain">${esc(sol.explain)}</div>`:''}</div><div class="questionFooter">${button('العودة إلى نص السؤال',"show('question')",'outline')}${SUPPORT[q.n]?button(SUPPORT[q.n].columns?'جدول المقارنة':'توضيح مصوّر',"show('support')") : ''}</div></div></article><div class="pager"><button class="pageBtn" onclick="jump(${index-1})" ${index===0?'disabled':''}>السؤال السابق</button><div class="counter">${index+1} / ${Q.length}</div><button class="pageBtn" onclick="jump(${index+1})" ${index===Q.length-1?'disabled':''}>السؤال التالي</button></div></section>`}
function qr(){return `<section class="screen"><div class="qrCard"><div class="smalltop">مراجعة إلكترونية من الكتاب المدرسي</div><h2>حل تقويم الدرس <bdi dir="ltr">1-2</bdi></h2><p>درجة الحرارة والحرارة • فيزياء الصف العاشر</p><img class="qrImg" src="${QR}" alt="الباركود الخاص برابط الموقع"><p>امسحي الباركود لفتح أسئلة التقويم وحلولها</p><div class="qrlink">${URL}</div><div class="qrButtons">${button('العودة للرئيسية',"show('home')",'outline')}${button('طباعة الباركود',"printBarcode()")}</div></div></section>`}
function support(){let q=Q[index],v=SUPPORT[q.n]; if(!v)return ans();
let figure=v.svg?`<div class="supportFigure">${v.svg}</div>`:v.image?`<div class="supportFigure"><img src="${v.image}" alt="${esc(v.title)}"></div>`:'';
let table=v.columns?`<table class="supportTable"><thead><tr>${v.columns.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${v.rows.map(row=>`<tr>${row.map(cell=>`<td>${qfmt(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'';
return `<section class="screen"><div class="meta"><div class="metaTitle">السؤال ${q.n} • توضيح علمي</div><div class="pageno">صفحة الكتاب 47</div></div><article class="paper"><div class="paperline"></div><div class="paperInner"><div class="supportBody"><h2 class="supportTitle">${esc(v.title)}</h2>${figure}${table}<div class="supportLead">${esc(v.lead)}</div></div><div class="supportControls">${button('العودة إلى الإجابة',"show('answer')",'outline')}</div></div></article><div class="pager"><button class="pageBtn" onclick="jump(${index-1})" ${index===0?'disabled':''}>السؤال السابق</button><div class="counter">${index+1} / ${Q.length}</div><button class="pageBtn" onclick="jump(${index+1})" ${index===Q.length-1?'disabled':''}>السؤال التالي</button></div></section>`}
function render(){el('content').innerHTML=({home,question,answer:ans,qr,support})[view]();}
function printBarcode(){let doc=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>باركود حل تقويم الدرس 1-2</title><style>body{font-family:'Noto Naskh Arabic',serif;color:#243b40;text-align:center;margin:40px}article{margin:0 auto;max-width:690px;border:2px solid #aecbcb;padding:35px;border-radius:10px}h1{font-size:31px}p{font-size:24px}img{width:290px}footer{font-size:24px;margin-top:25px;color:#743d4d}</style></head><body><article><div>الفيزياء • الصف العاشر</div><h1>حل تقويم الدرس <bdi dir="ltr">1-2</bdi></h1><p>درجة الحرارة والحرارة • صفحة الكتاب 47</p><img src="${QR}"><p>امسحي الباركود للدخول إلى تقويم الدرس وحلوله</p><footer>مع تحيات معلمة الفيزياء حفصة طيبي</footer></article><script>window.onload=()=>window.print()<\/script></body></html>`;const win=window.open('','_blank');if(win){win.document.open();win.document.write(doc);win.document.close()}else alert('يُرجى السماح بالنوافذ المنبثقة لطباعة الباركود')}
function printSupport(n){let v=SUPPORT[n];if(!v)return '';let graphic=v.svg?`<div>${v.svg}</div>`:v.image?`<img src="${v.image}" alt="">`:'';let table=v.columns?`<table><thead><tr>${v.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${v.rows.map(row=>`<tr>${row.map(c=>`<td>${qfmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'';
return `<div class="printSupport">${graphic}${table}<p>${esc(v.lead)}</p></div>`}
function makePrint(){let heading=`<div class="printHeading"><h1>حل تقويم الدرس <bdi dir="ltr">1-2</bdi></h1><p>درجة الحرارة والحرارة • الصف العاشر • صفحة 47</p></div>`;
let body=Q.map(q=>`<section class="printQuestion ${q.n===12?'veryLong':''}"><header><span>السؤال ${q.n}</span><span>صفحة الكتاب 47</span></header><div class="pq">${esc(q.text)}</div>${q.options?q.options.map(o=>`<div class="ppart">${esc(o)}</div>`).join(''):''}${(q.parts||[]).map(p=>`<div class="ppart">(${esc(p.id)}) ${esc(p.text)}</div>`).join('')}${q.solutions.map(s=>`<div class="psol"><strong>${esc(s.title)}</strong>${(s.steps||[]).map(([a,b])=>`<div><span class="plabel">${esc(a)}:</span> ${math(b)}</div>`).join('')}${s.answer?`<div><span class="plabel">الإجابة:</span> ${math(s.answer)}</div>`:''}${s.explain?`<div>${esc(s.explain)}</div>`:''}</div>`).join('')}${printSupport(q.n)}</section>`).join(''); el('printPack').innerHTML=heading+body+'<div class="ptfoot">مع تحيات معلمة الفيزياء حفصة طيبي</div>'}
window.addEventListener('keydown',e=>{if(view==='question'||view==='answer'){if(e.key==='ArrowLeft')jump(index+1);if(e.key==='ArrowRight')jump(index-1);if(e.key==='Escape')show('question')}});
render();makePrint();
const fontStyles=document.createElement('link');fontStyles.rel='stylesheet';fontStyles.href='https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Markazi+Text:wght@400;500;600;700&display=swap';document.head.appendChild(fontStyles);
</script></body></html>

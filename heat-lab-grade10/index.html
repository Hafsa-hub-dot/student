if(ri===0)return {caption:'الجولة 1 • الكلمة المفقودة',prompt:`أكملي تعريف «${item.term}»:<br>${safe(item.def.replace(item.key,'ــــــ'))}`,answer:item.key,options:item.opts,hint:'ارجعي إلى الكلمات الأساسية في التعريف.'};
if(ri===1)return {caption:'الجولة 2 • اكتشفي المصطلح',prompt:`أيُّ مصطلح يناسب هذا التعريف؟<br><span style="color:#6d5597">${safe(item.def)}</span>`,answer:item.term,options:[item.term,...shuffle(concepts.filter(c=>c.term!==item.term).map(c=>c.term),index).slice(0,3)],hint:'انتبهي للفرق بين الكمية والطاقة المنتقلة.'};
if(ri===2)return {caption:'الجولة 3 • اختاري المثال',prompt:`أي عبارة تطبق مفهوم «${item.term}» بدقة؟`,answer:item.example,options:[item.example,...shuffle(concepts.filter(c=>c.term!==item.term).map(c=>c.example),index).slice(0,3)],hint:'فكري في التعريف الذي رأيته وراء الستارة.'};
return {caption:'الجولة 4 • الموقف الحقيقي',prompt:safe(item.context),answer:item.app,options:item.apps,hint:'اربطي الحالة بما يحدث للجسيمات أو اتجاه انتقال الحرارة.'};}
if(ri===0)return {caption:'الجولة 1 • الرمز الناقص',prompt:`أكملي القانون:<br><span class="formula">${safe(item.blank)}</span>`,answer:item.key,options:item.opts,hint:item.hint};
if(ri===1)return {caption:'الجولة 2 • اتجاه التحويل',prompt:`ماذا يحوّل هذا القانون؟<br><span class="formula">${item.symbol}</span>`,answer:item.label,options:shuffle(laws.map(l=>l.label),index),hint:'انظري إلى الرمز وحدته في الطرف الأيسر.'};
if(ri===2)return {caption:'الجولة 3 • اختاري القانون الصحيح',prompt:`اختاري الصيغة الصحيحة لـ «${safe(item.term)}»`,answer:item.plain,options:shuffle(laws.map(l=>l.plain),index),hint:'تذكّري إشارة الجمع أو الطرح والكسر المناسب.'};
return {caption:'الجولة 4 • تثبيت بالتطبيق',prompt:safe(item.context),answer:item.app,options:item.apps,hint:item.hint};}
function renderGame(){const o=ALL[gameIndex],q=getRound(o,gameIndex,round),opts=shuffle(q.options,round*97+gameIndex*173+13),allDone=Object.keys(mastery).filter(k=>mastery[k]).length;const optsHTML=opts.map((v,i)=>`<button class="choice ${chosen===v?(chosen===q.answer?'correct':'wrong'):''}" ${solved?'disabled':''} onclick="checkAnswer(${JSON.stringify(v).replace(/"/g,'&quot;')})">${safe(v)}</button>`).join('');stage.innerHTML=frame(`<div class="sectionHead"><h2 class="display sectionTitle">🎮 تحدّي الحفظ</h2><div class="actions"><span class="counter">البطاقة ${gameIndex+1}/${ALL.length}</span><button class="btn soft" onclick="resetGame()" style="padding:7px 10px">↻ من البداية</button></div></div><div class="center"><span class="eyebrow">${o.type==='law'?'⚖️ قانون':'🧠 مفهوم'}: ${safe(o.term)}</span><div class="dots">${[0,1,2,3].map((i)=>`<span class="dot ${i<round?'done':i===round?'on':''}"></span>`).join('')}</div><div class="qtag">${q.caption} • أربع جولات مختلفة لتثبيت الحفظ</div><div class="quizPrompt">${q.prompt}</div></div><div class="choicegrid">${optsHTML}</div><div class="feedback ${solved?'good':chosen?'bad':''}" id="feedback">${solved?'🌟 إجابة صحيحة! أحسنتِ، تقدمّي للجولة التالية.':chosen?'❌ ليست الإجابة الصحيحة، حاولي من جديد.':'اختاري الإجابة الصحيحة من الأربع'}</div><div class="sectionFoot"><button class="btn white" onclick="changeGame(-1)">❮ بطاقة سابقة</button><span class="partBadge">${allDone}/${ALL.length} متقنة</span><button class="btn ${solved?'mint':'soft'}" ${solved?'':'disabled'} onclick="nextRound()">${round===3?'🏆 أتممي البطاقة':'الجولة التالية ←'}</button></div>`, 'كل إجابة صحيحة تقوّي ذاكرتك','🎯');}
function checkAnswer(value){if(solved)return;const correct=getRound(ALL[gameIndex],gameIndex,round).answer;chosen=value;solved=value===correct;renderGame();if(!solved){let el=document.getElementById('feedback');if(el)el.title=getRound(ALL[gameIndex],gameIndex,round).hint}}
function nextRound(){if(!solved)return;if(round<3){round++;chosen='';solved=false;renderGame();return}if(!mastery[gameIndex]){mastery[gameIndex]=true;stars+=4;save()}if(gameIndex<ALL.length-1){gameIndex++;round=0;chosen='';solved=false;renderGame()}else{stage.innerHTML=frame(`<div class="topic"><div style="font-size:clamp(80px,14vw,150px)">🏆</div><h2 class="display topicName">أنهيتِ رحلة الحفظ!</h2><p class="sub center">أحسنتِ! الآن يمكنك الانتقال إلى المسائل أو إعادة تدريبك في أي وقت.</p><div class="actions"><button class="btn main" onclick="setTab('problems')">🧮 ابدئي المسائل</button><button class="btn pink" onclick="resetGame()">🎮 أعيدي التحدي</button></div></div>`,'مبدعة في الفيزياء','🏆')}}
function changeGame(delta){gameIndex=(gameIndex+delta+ALL.length)%ALL.length;round=0;chosen='';solved=false;renderGame()}
function resetGame(){gameIndex=0;round=0;chosen='';solved=false;renderGame()}
function moveProblem(d){problemIndex=(problemIndex+d+questions.length)%questions.length;pstep=0;chosen='';solved=false;renderProblem()}
function getProblemRound(q){if(pstep===0)return {prompt:'ما المطلوب إيجاده في هذه المسألة؟',options:q.targetOpts,answer:q.targetName,hint:'انتبهي للوحدة الموجودة بعد «حوّلي إلى».',label:'المطلوب'};if(pstep===1)return {prompt:'أي قانون من قوانين الكتاب يناسب المعطى والمطلوب؟',options:q.lawOpts,answer:q.law,hint:'اتجاه التحويل يحدد القانون.',label:'العلاقات'};if(pstep===2)return {prompt:'احسبي بالتعويض، ثم اختاري الناتج الصحيح بوحدته.',options:q.answers,answer:q.result.split(' ≈ ').pop(),hint:'استخدمي الأقواس وانتظري حتى تنتهي العملية الحسابية.',label:'الحل'};return null}
function renderProblem(){const q=questions[problemIndex];const info=`<div class="sectionHead"><h2 class="display sectionTitle">🧮 حلّ المسائل</h2><span class="counter">${problemIndex+1} من ${questions.length}</span></div><div class="problemStory"><span class="problemBook">${q.n==='مثال 1'?'مثال 1 — صفحة 46':'السؤال ' + safe(q.n) + ' — صفحة 47'}</span><span class="problemStatement">${safe(q.story)}</span></div><div class="miniStep">${['المطلوب','المعطيات','القانون والحل','النتيجة'].map((s,i)=>`<span class="${i===pstep?'current':i<pstep?'done':''}">${i+1} ${s}</span>`).join('')}</div>`;
if(pstep===3){stage.innerHTML=frame(`${info}<div class="worked"><p><strong>المطلوب:</strong> <span class="math">${safe(q.target)}</span></p><p><strong>المعطيات:</strong> <span class="math">${safe(q.given)}</span></p><p><strong>العلاقات:</strong> <span class="math">${safe(q.law)}</span></p><p><strong>الحل:</strong> <span class="math">${safe(q.sub)}</span></p><p class="answer">✅ ${safe(q.result)}</p><p class="legal" style="color:#555">${safe(q.note)}</p></div><div class="sectionFoot"><button class="btn white" onclick="moveProblem(-1)">❮ المسألة السابقة</button><button class="btn soft" onclick="pstep=0;chosen='';solved=false;renderProblem()">↻ أعيدي التدريب</button><button class="btn main" onclick="moveProblem(1)">التالية ❯</button></div>`,'فهمتِ المسألة من البداية للنهاية!','🏅');return;}
const pr=getProblemRound(q);let ans=pr.answer;if(pstep===2){ans=q.answers.find(x=>x===q.result.split(' ≈ ').pop())||q.answers[0]}
const options=shuffle(pr.options,problemIndex*61+pstep*13);const optHTML=options.map(x=>`<button class="choice ${chosen===x?(solved?'correct':'wrong'):''}" ${solved?'disabled':''} onclick="answerProblem(${JSON.stringify(x).replace(/"/g,'&quot;')})">${safe(x)}</button>`).join('');stage.innerHTML=frame(`${info}<div class="center"><span class="eyebrow">${pstep===0?'نقرأ السؤال أولًا':pstep===1?'المعطيات: '+q.given:'الآن عوّضي في القانون'}</span><div class="problemLabel">${safe(pr.prompt)}</div></div>${pstep===2?`<div class="problemStory" style="background:#f8f4ff;border-color:#ded4fc"><span class="math">${safe(q.sub)}</span></div>`:''}<div class="choicegrid">${optHTML}</div><div class="feedback ${solved?'good':chosen?'bad':''}">${solved?'🌟 ممتاز! الخطوة صحيحة.':chosen?'جربي مرة أخرى، راجعي المعطيات.':'اختاري الإجابة، ولن تنتقلي حتى تتقنيها.'}</div><div class="sectionFoot"><button class="btn white" onclick="moveProblem(-1)">❮ السابقة</button><span class="partBadge">${safe(q.name)}</span><button class="btn ${solved?'mint':'soft'}" ${solved?'':'disabled'} onclick="advanceProblem()">${pstep===2?'اظهري الحل كاملًا':'التالي ←'}</button></div>`,'حدّدي المطلوب قبل أن تكتبي القانون','🔬')}
function answerProblem(v){if(solved)return;const q=questions[problemIndex];const correct=pstep===0?q.targetName:pstep===1?q.law:(q.result.split(' ≈ ').pop());chosen=v;solved=(v===correct);renderProblem()}
function advanceProblem(){if(!solved)return;pstep++;chosen='';solved=false;renderProblem()}

function renderShare(){const live=isHosted(),url=live?location.origin+location.pathname:PUBLIC_REVIEW_URL;stage.innerHTML=frame(`<div class="sectionHead"><h2 class="display sectionTitle">🖨️ طباعة وباركود</h2><span class="counter">للمعلمة والطالبات</span></div><div class="shareIntro">محتوى المراجعة كاملًا يُطبع <b>بالأبيض والأسود على A4</b>: التعاريف، القوانين، الأسئلة وإجاباتها، والمسائل بالمطلوب والمعطيات والعلاقات والحل. كما يمكن إنشاء باركود للرابط المنشور.</div><div class="shareArea"><div class="shareLeft"><span class="eyebrow">📄 ملف شامل للطباعة</span><button class="btn main" onclick="printAll()">🖨️ طباعة / حفظ PDF لجميع المحتويات</button><button class="btn white" onclick="printExercisesOnly()">✏️ طباعة ورقة تدريب للطالبات</button><span class="eyebrow">🔗 رابط فتح المراجعة للطالبات</span><input class="urlInput" id="shareUrl" aria-label="رابط المراجعة" placeholder="الصقي هنا الرابط المنشور بعد رفع الموقع" value="${safe(url)}" oninput="drawQR()"><div class="actions"><button class="btn pink" onclick="drawQR()">▦ إنشاء الباركود</button><button class="btn soft" onclick="copyLink()">📋 نسخ الرابط</button></div></div><div class="qrbox" id="qrBox"><span>▦<br>سيظهر الباركود هنا عند إدخال رابط ويب صحيح</span></div></div><div class="notice" id="shareNotice">${live?'✅ هذه نسخة منشورة على الويب؛ يمكن استعمال الرابط والباركود للوصول إليها.':'✅ رُفع الملف إلى GitHub Pages. اختبري فتح الرابط على هاتف آخر قبل توزيع الباركود.'}</div><p class="legal">حفظ التقدم يحدث على جهاز الطالبة فقط، ولا يُرسَل اسم أو معلومات شخصية لأي خادم. إذا لم يعمل ملء الشاشة التلقائي في متصفح الهاتف فاضغطي ⛶.</p>`, 'مراجعة جميلة على الشاشة وواضحة على الورق','📚');drawQR()}
function copyLink(){const u=document.getElementById('shareUrl')?.value.trim();if(!u){notice('أدخلي رابطًا منشورًا أولًا.');return}navigator.clipboard?.writeText(u).then(()=>notice('✅ تم نسخ الرابط.')).catch(()=>{document.getElementById('shareUrl').select();document.execCommand('copy');notice('✅ تم نسخ الرابط.')})}
function notice(v){const p=document.getElementById('shareNotice');if(p)p.textContent=v}
function drawQR(){const box=document.getElementById('qrBox'),u=document.getElementById('shareUrl')?.value.trim();if(!box)return;try{const link=new URL(u);if(!['https:','http:'].includes(link.protocol))throw new Error();box.innerHTML='';if(typeof QRCode==='undefined'){if(link.toString()===PUBLIC_REVIEW_URL){box.innerHTML='<img alt="باركود المراجعة" src="'+EMBEDDED_QR+'">';notice('✅ باركود ثابت لنسخة GitHub. تأكدي من فتح رابط الموقع على هاتف الطالبة.');return}box.innerHTML='<span>لإنشاء باركود لرابط مختلف، وصّلي الجهاز بالإنترنت.</span>';return}new QRCode(box,{text:link.toString(),width:183,height:183,colorDark:'#171b2c',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});notice('✅ هذا الباركود يفتح الرابط المدخل عند مسحه. تحققي من نشر الموقع قبل توزيعه.')}catch(e){box.innerHTML='<span>ادخلي رابط ويب صحيحًا يبدأ بـ https://</span>';notice('أدخلي عنوان الموقع المنشور وليس مسار ملف محليًا.')}}

function buildPrint(){
const cleanPrompt=(txt)=>String(txt).replace(/<[^>]*>/g,' ').replace(/&[^;]+;/g,' ');
const prettyMath=(v)=>safe(v).replace(/T_([CFK])/g,'<i>T</i><sub>$1</sub>').replace(/(5|9)\/(5|9)/g,'<span class="mathFraction"><span>$1</span><span>$2</span></span>');
const bookRef=(q)=>q.n==='مثال 1'? 'مثال 1 | صفحة الكتاب 46' : 'السؤال '+q.n+' | صفحة الكتاب 47';
const html=`
<div class="formalHeader">
  <div class="formalInstitution">مدرسة العب الثانوية للبنات <span class="sep">|</span> قسم الفيزياء</div>
  <div class="formalEyebrow">ملف المراجعة والتدريب</div>
  <h1>درجة الحرارة والحرارة</h1>
  <div class="formalSubtitle">الفيزياء — الصف العاشر — الدرس 1-2</div>
  <div class="studentLines"><span>اسم الطالبة: ....................................</span><span>الشعبة: ....................</span><span>التاريخ: ....................</span></div>
  <p class="formalPrepared">إعداد: معلمة الفيزياء حفصة طيبي</p>
</div>
<section class="printTheory">
  <div class="formalSection"><span class="num">01</span><h2>مراجعة المفاهيم الأساسية</h2></div>
  <p class="introNote">اقرئي المصطلح وتعريفه، ثم اختبري قدرتك على استرجاعه دون النظر إلى الإجابة.</p>
  ${concepts.map((c,i)=>`<article class="printConcept"><h3><span class="smallNumber">مفهوم ${i+1}</span> ${safe(c.term)}</h3><p class="termDefinition">${safe(c.def)}</p><p class="termExample"><strong>مثال توضيحي:</strong> ${safe(c.example)}</p></article>`).join('')}
</section>
<section class="printLaws">
  <div class="formalSection"><span class="num">02</span><h2>القوانين المعتمدة من الكتاب</h2></div>
  <p class="introNote">المرجع: الكتاب المدرسي، صفحة 46 (معادلات التحويل 1-2 و2-2 و3-2، بالإضافة إلى إعادة ترتيب القانون الثالث).</p>
  ${laws.map((l,i)=>`<article class="printLaw"><div class="lawInfo"><strong>القانون ${i+1}</strong><span>${safe(l.term)}</span></div><div class="printFormula" dir="ltr">${prettyMath(l.plain)}</div><p class="lawHint">${safe(l.hint)}</p></article>`).join('')}
  <div class="formalRemark"><strong>تمييز مهم:</strong> في فروق درجات الحرارة: فرق 1°C يعادل فرق 1.8°F؛ ولا تُضاف 32 عند حساب الفرق.</div>
</section>
<section class="printGame">
  <div class="formalSection"><span class="num">03</span><h2>تدريبات تثبيت المفاهيم والقوانين</h2></div>
  <p class="introNote">لكل مفهوم وقانون 4 تدريبات متدرجة. اقرئي السؤال المكتوب بخط واضح، ثم تحققي من الإجابة.</p>
  ${ALL.map((c,i)=>`<article class="printExercise"><h3 class="exerciseTitle"><span class="smallNumber">بطاقة ${i+1}</span> ${safe(c.term)}</h3>${[0,1,2,3].map((r)=>{const q=getRound(c,i,r);return `<div class="printQA"><div class="questionLine"><span class="questionNumber">السؤال ${r+1}</span><span class="questionWords">${safe(cleanPrompt(q.prompt))}</span></div><div class="printAnswer"><strong>الإجابة النموذجية:</strong> ${safe(q.answer)}</div></div>`}).join('')}</article>`).join('')}
</section>
<section class="printSolved">
  <div class="formalSection"><span class="num">04</span><h2>المسائل المحلولة على طريقة الكتاب</h2></div>
  <p class="introNote">تُكتب لكل مسألة: المطلوب ← المعطيات ← العلاقات ← الحل بالتعويض ← الإجابة النهائية.</p>
  ${questions.map((q,i)=>`<article class="printProblem">
    <div class="problemPrintHead"><span class="refBadge">${bookRef(q)}</span><span class="problemPrintTitle">${safe(q.name)}</span></div>
    <div class="problemPrintQuestion">${safe(q.story)}</div>
    <div class="printRow"><div class="printRowLabel">المطلوب</div><div class="printRowBody">${safe(q.targetName)}</div></div>
    <div class="printRow"><div class="printRowLabel">المعطيات</div><div class="printRowBody mathValue" dir="ltr">${prettyMath(q.given)}</div></div>
    <div class="printRow"><div class="printRowLabel">العلاقات</div><div class="printRowBody mathValue" dir="ltr">${prettyMath(q.law)}</div></div>
    <div class="printRow"><div class="printRowLabel">الحل بالتعويض</div><div class="printRowBody mathValue" dir="ltr">${prettyMath(q.sub)}</div></div>
    <div class="printRow finalResult"><div class="printRowLabel">الإجابة النهائية</div><div class="printRowBody mathValue" dir="ltr">${prettyMath(q.result)}</div></div>
    <div class="problemPrintNote"><strong>الفهم العلمي:</strong> ${safe(q.note)}</div>
  </article>`).join('')}
</section>
<section class="printAnswers">
  <div class="formalSection"><span class="num">05</span><h2>تقويم الدرس — الإجابات المفاهيمية</h2></div>
  <p class="introNote">المرجع: أسئلة تقويم الدرس 1-2، صفحة الكتاب 47.</p>
  ${conceptReview.map(q=>`<article class="printAssessment"><div class="questionLine"><span class="questionNumber">السؤال ${safe(q[0])} | ص 47</span><span class="questionWords">${safe(q[1])}</span></div><p><strong>الإجابة النموذجية:</strong> ${safe(q[2])}</p></article>`).join('')}
</section>
<section class="printQR"><div class="formalSection"><span class="num">06</span><h2>النسخة التفاعلية</h2></div><p>امسحي الرمز للانتقال إلى المراجعة والألعاب والمسائل.</p><img src="${EMBEDDED_QR}" alt="باركود المراجعة التفاعلية"><div class="printLink" dir="ltr">${PUBLIC_REVIEW_URL}</div><p>من إعداد معلمة الفيزياء حفصة طيبي</p></section>
<div class="printFooter">مدرسة العب الثانوية للبنات — قسم الفيزياء | الصف العاشر | حفصة طيبي</div>`;
document.getElementById('printPack').innerHTML=html;
}
buildPrint();render();
</script>

<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة آفاق فلكية</title><style>body{font-family:Tahoma,Arial;background:#f5f7fa;color:#1a3346;margin:0}main{max-width:1000px;margin:50px auto;padding:24px}h1{font-size:30px}button{padding:13px 23px;border:0;border-radius:10px;background:#125575;color:white;cursor:pointer;margin:8px}table{width:100%;background:white;border-collapse:collapse}td,th{padding:13px;border-bottom:1px solid #ddd;text-align:right}.panel{background:white;border-radius:16px;padding:20px;margin:16px 0}.warn{color:#a34022}</style><main><h1>لوحة إدارة آفاق فلكية</h1><p>بيانات المشاركات محفوظة في Firebase ولا تُعرض للزائرات.</p><section class="panel"><button id="login">الدخول بحساب Google للإدارة</button><button id="export" disabled>تصدير Excel</button><p id="status">يرجى تسجيل الدخول بحساب الإدارة المصرح له.</p></section><section class="panel"><h2>المشاركات</h2><table><thead><tr><th>الاسم</th><th>الفئة</th><th>الصف</th><th>الإجابات</th><th>الصفحة</th><th>مكتمل</th></tr></thead><tbody id="rows"></tbody></table></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,collection,getDocs}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyBvBkZsnnI3KEzi4ACuy35DttxEXOyCqQc',authDomain:'afaak-fd067.firebaseapp.com',projectId:'afaak-fd067',appId:'1:284408636147:web:3a820ed8563bb82f8f4d86'});const auth=getAuth(app),db=getFirestore(app);let rows=[];const status=document.getElementById('status');function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('rows').innerHTML=rows.map(d=>'<tr><td>'+safe(d.profile?.name||d.profile?.fullName)+'</td><td>'+safe(d.profile?.role)+'</td><td>'+safe(d.profile?.grade)+'</td><td>'+Object.keys(d.answers||{}).length+'</td><td>'+safe(d.page)+'</td><td>'+(d.completed?'نعم':'لا')+'</td></tr>').join('')}async function load(){try{const snap=await getDocs(collection(db,'participants'));rows=snap.docs.map(d=>({id:d.id,...d.data()}));render();document.getElementById('export').disabled=false;status.textContent='تم تحميل '+rows.length+' مشاركة'}catch(e){status.textContent='لا توجد صلاحية لقراءة المشاركات بعد. يلزم تفعيل دخول Google للإدارة وتحديث قواعد Firestore للمشرفة فقط. ('+e.code+')';status.className='warn'}}document.getElementById('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());await load()}catch(e){status.textContent='تعذر تسجيل الدخول: '+e.message}};document.getElementById('export').onclick=()=>{const header=['الاسم','الفئة','الصف','الصفحة','مكتمل','الإجابات','التعليقات','UID'];const lines=[header,...rows.map(d=>[d.profile?.name||d.profile?.fullName||'',d.profile?.role||'',d.profile?.grade||'',d.page??'',d.completed?'نعم':'لا',JSON.stringify(d.answers||{}),JSON.stringify(d.feedback||{}),d.id])];const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='afaq-participants.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};</script></html>

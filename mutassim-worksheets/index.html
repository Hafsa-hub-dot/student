ْلِيَّةُ وَ______ مِنْ أَشْكَالِ السَّطْحِ الدَّاخِلِيَّةِ."},{"no":20,"lesson":"أشكال سطح قطر","q":"أَكْمِلْ: الْجُزُرُ وَالْخُلْجَانُ وَالرُّؤُوسُ الْأَرْضِيَّةُ وَ______ مِنْ أَشْكَالِ السَّطْحِ السَّاحِلِيَّةِ."},{"no":21,"lesson":"أشكال سطح قطر","q":"مَا الْمُصْطَلَحُ؟ كُتَلٌ مِنَ الرِّمَالِ تَكَوَّنَتْ بِفِعْلِ الرِّيَاحِ."},{"no":22,"lesson":"مناخ قطر","q":"أَكْمِلْ: مِنْ صِفَاتِ شِتَاءِ قَطَرَ ______."},{"no":23,"lesson":"مناخ قطر","q":"أَكْمِلْ: يَكُونُ صَيْفُ قَطَرَ ______."},{"no":24,"lesson":"مناخ قطر","q":"أَكْمِلْ: مِنَ النَّبَاتَاتِ الْمُعَمَّرَةِ فِي قَطَرَ ______."},{"no":25,"lesson":"مناخ قطر","q":"أَكْمِلْ: مِنَ النَّبَاتَاتِ الْحَوْلِيَّةِ ______."},{"no":26,"lesson":"مناخ قطر","q":"أَكْمِلْ: مِنَ الزَّوَاحِفِ فِي قَطَرَ ______."},{"no":27,"lesson":"مناخ قطر","q":"اُذْكُرْ 3 أَمْثِلَةٍ لِلْحَيَوَانَاتِ الْآكِلَةِ لِلْعُشْبِ."},{"no":28,"lesson":"مناخ قطر","q":"اُذْكُرْ مِثَالًا لِلطُّيُورِ فِي قَطَرَ."},{"no":29,"lesson":"مناخ قطر","q":"اُذْكُرْ مِثَالًا لِنَبَاتٍ مُعَمَّرٍ فِي قَطَرَ."},{"no":30,"lesson":"مناخ قطر","q":"أَكْمِلْ: مِنْ صِفَاتِ شِتَاءِ قَطَرَ انْخِفَاضُ دَرَجَاتِ الْحَرَارَةِ وَسُقُوطُ الْأَمْطَارِ وَ______."},{"no":31,"lesson":"مناخ قطر","q":"أَكْمِلْ: يَتَمَيَّزُ صَيْفُ قَطَرَ بِارْتِفَاعِ الْحَرَارَةِ وَالرُّطُوبَةِ وَ______."},{"no":32,"lesson":"مناخ قطر","q":"أَكْمِلْ: مِنَ النَّبَاتَاتِ الْمُعَمَّرَةِ السِّدْرُ وَ______."},{"no":33,"lesson":"مناخ قطر","q":"أَكْمِلْ: مِنَ النَّبَاتَاتِ الْحَوْلِيَّةِ الْفَقْعُ وَ______."},{"no":34,"lesson":"أسرة آل ثاني","q":"إلى أين اتجهت القبائل العربية المهاجرة في الدرس؟"},{"no":35,"lesson":"أسرة آل ثاني","q":"أَكْمِلْ: هَاجَرَتِ الْقَبَائِلُ بِسَبَبِ ______."},{"no":36,"lesson":"أسرة آل ثاني","q":"أَكْمِلْ: كَانَتِ الْقَبَائِلُ تَبْحَثُ عَنْ ______."},{"no":37,"lesson":"أسرة آل ثاني","q":"أين ولد الشيخ محمد بن ثاني؟"},{"no":38,"lesson":"أسرة آل ثاني","q":"ما العمل الذي قام به الشيخ محمد بن ثاني؟"},{"no":39,"lesson":"أسرة آل ثاني","q":"ما الإنجاز السياسي المذكور للشيخ محمد بن ثاني؟"},{"no":40,"lesson":"أسرة آل ثاني","q":"من أول حاكم يظهر في تسلسل حكام قطر في الملخص؟"},{"no":41,"lesson":"أسرة آل ثاني","q":"من الذي تولّى حكم قطر عام 2013؟"},{"no":42,"lesson":"أسرة آل ثاني","q":"أَكْمِلْ: تَوَلَّى الشَّيْخُ تَمِيمُ بْنُ حَمَدٍ آلِ ثَانِي حُكْمَ قَطَرَ عَامَ ______."},{"no":43,"lesson":"نشأة إمارة قطر","q":"أين نشأ الشيخ جاسم بن محمد بن ثاني؟"},{"no":44,"lesson":"نشأة إمارة قطر","q":"في أيّ تجارة عمل الشيخ جاسم مع والده؟"},{"no":45,"lesson":"نشأة إمارة قطر","q":"أَكْمِلْ: تَوَلَّى الشَّيْخُ جَاسِمٌ حُكْمَ قَطَرَ فِي ______."},{"no":46,"lesson":"نشأة إمارة قطر","q":"أَكْمِلْ: مَنَحَتِ الدَّوْلَةُ الْعُثْمَانِيَّةُ الشَّيْخَ جَاسِمًا لَقَبَ ______."},{"no":47,"lesson":"نشأة إمارة قطر","q":"أَكْمِلْ: تُوُفِّيَ الشَّيْخُ جَاسِمٌ عَامَ 1913م وَدُفِنَ فِي ______."},{"no":48,"lesson":"نشأة إمارة قطر","q":"اُذْكُرْ سَبَبًا مِنْ أَسْبَابِ مَعْرَكَةِ الْوَجْبَةِ."},{"no":49,"lesson":"نشأة إمارة قطر","q":"أَكْمِلْ: كَانَ مِنْ أَسْبَابِ مَعْرَكَةِ الْوَجْبَةِ ______."},{"no":50,"lesson":"نشأة إمارة قطر","q":"من طرفا معركة الوجبة؟"},{"no":51,"lesson":"نشأة إمارة قطر","q":"أَكْمِلْ: مِنْ نَتَائِجِ مَعْرَكَةِ الْوَجْبَةِ ______."},{"no":52,"lesson":"نشأة إمارة قطر","q":"ما النتيجة الأخرى لمعركة الوجبة؟"},{"no":53,"lesson":"نشأة إمارة قطر","q":"أَكْمِلْ: مِنْ صِفَاتِ الشَّيْخِ جَاسِمٍ ______."},{"no":54,"lesson":"نشأة إمارة قطر","q":"أَكْمِلْ: مِنْ أَعْمَالِ الشَّيْخِ جَاسِمٍ الدِّينِيَّةِ ______."},{"no":55,"lesson":"نشأة إمارة قطر","q":"بماذا تميّز عهد الشيخ جاسم؟"},{"no":56,"lesson":"نشأة إمارة قطر","q":"أَكْمِلْ: تُوُفِّيَ الشَّيْخُ جَاسِمٌ بْنُ مُحَمَّدٍ بْنِ ثَانِي عَامَ ______."},{"no":57,"lesson":"نشأة إمارة قطر","q":"أَكْمِلْ: مِنْ نَتَائِجِ مَعْرَكَةِ الْوَجْبَةِ انْتِصَارُ الْقُوَّاتِ الْقَطَرِيَّةِ وَ______."}];
const LESSONS=[...new Set(DATA.map(q=>q.lesson))];
const $=sel=>document.querySelector(sel);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected='all',visible=DATA,idx=0;
function sheet(q,n,total){
 const repeated=Array.from({length:4},(_,i)=>`<section class="attempt">
  <div class="try-head"><span class="try-label">المحاولة ${i+1}</span><span class="try-judge">صحيحة؟ <span class="box"></span></span></div>
  <div class="prompt">${esc(q.q)}</div>
  <div class="blank-lines"><div></div><div></div><div></div></div>
 </section>`).join('');
 return `<article class="paper">
  <div class="sheet-head">
   <div class="head-row"><b class="head-title">المعتصم | تدريب كتابي</b><span class="page-count">${n} / ${total}</span></div>
   <div class="sub-row"><span>${esc(q.lesson)}</span><span>السؤال ${q.no} من ${DATA.length}</span></div>
   <div class="meta-row"><span>الاسم: المعتصم</span><span>التاريخ: .............................</span></div>
  </div>
  <div class="attempts">${repeated}</div>
  <div class="foot"><span>بعد المحاولة الرابعة:</span><span><span class="box"></span> أتقنت الإجابة</span><span><span class="box"></span> أحتاج مراجعة</span></div>
 </article>`;
}
function render(){
 const q=visible[idx];if(!q)return;
 $('#preview').innerHTML=sheet(q,idx+1,visible.length);
 $('#counter').textContent=`${idx+1} / ${visible.length}`;
 $('#prev').disabled=idx===0;$('#next').disabled=idx>=visible.length-1;
 $('#info').textContent=`السؤال ${q.no} · السؤال مكتوب 4 مرات · مساحة مستقلة للإجابة في كل محاولة`;
}
function filter(){
 selected=$('#lesson').value;
 visible=selected==='all'?DATA:DATA.filter(q=>q.lesson===selected);
 idx=0;render();
}
function printPages(kind){
 const pages=kind==='all'?DATA:kind==='lesson'?
 DATA.filter(q=>q.lesson===(selected==='all'?visible[idx].lesson:selected)):
 [visible[idx]];
 $('#printArea').innerHTML=pages.map((q,i)=>sheet(q,i+1,pages.length)).join('');
 requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));
}
$('#lesson').innerHTML=`<option value="all">كل الدروس (${DATA.length} سؤالًا)</option>`+
 LESSONS.map(l=>`<option value="${esc(l)}">${esc(l)} (${DATA.filter(x=>x.lesson===l).length} سؤالًا)</option>`).join('');
$('#lesson').onchange=filter;
$('#prev').onclick=()=>{if(idx>0){idx--;render()}};
$('#next').onclick=()=>{if(idx+1<visible.length){idx++;render()}};
$('#printOne').onclick=()=>printPages('one');

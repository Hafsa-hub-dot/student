name: Apply mentor layout cleanup

on:
  push:
    paths:
      - '.github/workflows/mentor-layout-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch mentor page layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'MENTOR_LAYOUT_V57'
          if marker in s:
              print('Patch already applied')
              raise SystemExit(0)

          patch = r'''
<style id="MENTOR_LAYOUT_V57">
/* ============================================================
   MENTOR_LAYOUT_V57 — cleaner, compact class-advisor workspace
   Layout-only patch. No data/Firebase logic changed.
   ============================================================ */
#seating.view.active{
  padding-top:0!important;
}
#seating .seatingWorkspace{
  display:flex!important;
  flex-direction:column!important;
  gap:9px!important;
  width:100%!important;
}

/* navigation first: clear, compact and always visible */
#seating .mentorToolSwitch{
  order:-30!important;
  position:sticky!important;
  top:6px!important;
  z-index:18!important;
  width:min(660px,100%)!important;
  margin:0 auto 2px!important;
  padding:6px!important;
  display:grid!important;
  grid-template-columns:1fr 1fr!important;
  gap:7px!important;
  border:1px solid #E3E8E7!important;
  border-radius:18px!important;
  background:rgba(255,255,255,.96)!important;
  backdrop-filter:blur(10px)!important;
  box-shadow:0 6px 18px rgba(33,58,60,.07),inset 0 1px 0 #fff!important;
}
#seating .mentorToolSwitch button{
  min-height:46px!important;
  padding:8px 16px!important;
  border:1px solid #DDE6E4!important;
  border-radius:13px!important;
  background:linear-gradient(180deg,#FFF,#F7FAF9)!important;
  color:#31565A!important;
  font-family:"El Messiri","Noto Kufi Arabic",sans-serif!important;
  font-size:14px!important;
  font-weight:800!important;
  cursor:pointer!important;
  box-shadow:0 3px 8px rgba(35,64,66,.05),inset 0 1px 0 #fff!important;
  transition:.16s ease!important;
}
#seating .mentorToolSwitch button:hover{
  transform:translateY(-1px)!important;
}
#seating .mentorToolSwitch button.active,
#seating .mentorToolSwitch button[aria-pressed="true"]{
  border-color:#7E1433!important;
  background:linear-gradient(180deg,#94183D,#78142F)!important;
  color:#FFF!important;
  box-shadow:0 6px 14px rgba(109,22,49,.18),inset 0 1px 0 rgba(255,255,255,.18)!important;
}
#seating .mentorToolSwitch button span{
  display:inline-grid!important;
  place-items:center!important;
  width:24px!important;
  height:24px!important;
  margin-left:7px!important;
  border-radius:8px!important;
  background:rgba(14,122,126,.08)!important;
}
#seating .mentorToolSwitch button.active span,
#seating .mentorToolSwitch button[aria-pressed="true"] span{
  background:rgba(255,255,255,.15)!important;
}

/* compact identity + selectors row */
#seating .seatingHero{
  order:-20!important;
  grid-template-columns:minmax(240px,.72fr) minmax(440px,1.28fr)!important;
  gap:12px!important;
  align-items:center!important;
  padding:11px 14px!important;
  border-radius:18px!important;
  box-shadow:0 5px 14px rgba(36,57,58,.05)!important;
}
#seating .seatingHeroTitle{
  gap:10px!important;
  align-items:center!important;
}
#seating .seatingLogo{
  width:44px!important;
  height:44px!important;
  flex:0 0 44px!important;
  border-radius:13px!important;
  font-size:21px!important;
}
#seating .seatingEyebrow{
  font-size:9px!important;
}
#seating .seatingHero h2{
  font-size:21px!important;
  line-height:1.25!important;
}
#seating .seatingHero p{
  display:none!important;
}
#seating .seatingSelectors{
  grid-template-columns:minmax(150px,1fr) minmax(170px,1fr) auto!important;
  gap:8px!important;
  align-items:end!important;
}
#seating .seatingSelectors .field{
  margin:0!important;
  gap:3px!important;
}
#seating .seatingSelectors label{
  margin:0!important;
  font-size:9px!important;
}
#seating .seatingSelectors select{
  min-height:39px!important;
  height:39px!important;
  border-radius:11px!important;
  font-size:12px!important;
  padding:5px 9px!important;
}
#seating .seatingRowsBadge{
  min-height:39px!important;
  height:39px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  padding:5px 10px!important;
  border-radius:11px!important;
  white-space:nowrap!important;
  font-size:9px!important;
}

/* one tidy command bar instead of a crowded block */
#seating .seatingControlBar{
  order:-10!important;
  display:grid!important;
  grid-template-columns:minmax(170px,.65fr) minmax(0,1.35fr)!important;
  align-items:center!important;
  gap:10px!important;
  padding:8px 10px!important;
  border-radius:14px!important;
  box-shadow:0 4px 11px rgba(35,64,66,.04)!important;
}
#seating .seatingControlBar>div:first-child{
  min-width:0!important;
}
#seating .seatingControlBar strong{
  font-size:11px!important;
}
#seating .seatingControlBar>div:first-child>span{
  display:none!important;
}
#seating .seatingActions{
  display:flex!important;
  justify-content:flex-end!important;
  align-items:center!important;
  gap:5px!important;
  flex-wrap:wrap!important;
}
#seating .seatingActions button{
  min-height:34px!important;
  padding:6px 9px!important;
  border-radius:10px!important;
  font-size:9px!important;
}

/* applications: concise header, table gets the space */
#seating .applicationsManager{
  margin:0!important;
  padding:12px!important;
  border-radius:18px!important;
}
#seating .applicationsManager>.section{
  margin-bottom:7px!important;
}
#seating .applicationsManager h2{
  margin:0!important;
  font-size:17px!important;
}
#seating .applicationsManager .sub{
  font-size:8px!important;
  line-height:1.55!important;
}

/* kroki uses horizontal space efficiently */
#seating .seatingBuilderGrid{
  grid-template-columns:245px minmax(0,1fr)!important;
  gap:9px!important;
  align-items:start!important;
}
#seating .unseatedPanel,
#seating .classroomCard{
  border-radius:17px!important;
}
#seating .unseatedPanel{
  padding:10px!important;
}
#seating .unseatedPanel .section{
  margin-bottom:6px!important;
}
#seating .unseatedPanel .sub{
  display:none!important;
}
#seating .seatingStudentPool{
  padding-top:5px!important;
  gap:5px!important;
}
#seating .unseatedStudent{
  min-height:39px!important;
  padding:6px 8px!important;
  border-radius:10px!important;
  font-size:10px!important;
}
#seating .classroomCard{
  padding:10px!important;
}
#seating .seatingRoom{
  min-height:520px!important;
  padding:12px!important;
  border-radius:15px!important;
}

@media(max-width:1000px){
  #seating .mentorToolSwitch{
    position:static!important;
  }
  #seating .seatingHero{
    grid-template-columns:1fr!important;
  }
  #seating .seatingSelectors{
    grid-template-columns:1fr 1fr!important;
  }
  #seating .seatingRowsBadge{
    grid-column:1/-1!important;
  }
  #seating .seatingControlBar{
    grid-template-columns:1fr!important;
  }
  #seating .seatingActions{
    justify-content:flex-start!important;
  }
  #seating .seatingBuilderGrid{
    grid-template-columns:1fr!important;
  }
}

@media(max-width:650px){
  #seating .mentorToolSwitch{
    grid-template-columns:1fr 1fr!important;
    padding:5px!important;
  }
  #seating .mentorToolSwitch button{
    min-height:43px!important;
    padding:7px 8px!important;
    font-size:11px!important;
  }
  #seating .seatingSelectors{
    grid-template-columns:1fr!important;
  }
  #seating .seatingRowsBadge{
    grid-column:auto!important;
  }
}
</style>
<script id="MENTOR_LAYOUT_V57_SCRIPT">
(function(){
  function tidyMentorLayout(){
    const workspace=document.querySelector('#seating .seatingWorkspace');
    const switcher=workspace&&workspace.querySelector('.mentorToolSwitch');
    if(workspace&&switcher&&workspace.firstElementChild!==switcher){
      workspace.insertBefore(switcher,workspace.firstElementChild);
    }
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',tidyMentorLayout,{once:true});
  }else{
    tidyMentorLayout();
  }
})();
</script>
'''
          if '</body>' not in s:
              raise SystemExit('Could not find </body>')
          s = s.replace('</body>', patch + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('Applied mentor layout patch')
          PY
      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish class advisors layout"
          git push origin main

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fbfa">
<title>المعتصم | اختبار القلم والورقة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Markazi+Text:wght@500;600;700&display=swap');
:root{--ink:#172f37;--teal:#0a7478;--dark:#075a60;--muted:#658087;--line:#dbe9e7;--mint:#eef7f5;--gold:#b6873b;--white:#fff;--accent:#89465d;}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#f8fbfa;color:var(--ink);font-family:'El Messiri',Tahoma,Arial,sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #d2a24e;outline-offset:3px}button:disabled{cursor:default;opacity:.5}
#app{height:100dvh;min-height:0;display:flex;flex-direction:column;max-width:1500px;margin:0 auto;padding:clamp(7px,1.4vh,15px) clamp(8px,2vw,27px);gap:clamp(5px,1vh,12px)}
.top{display:flex;flex-shrink:0;align-items:center;justify-content:space-between;gap:10px;min-height:42px}
.brand{font-weight:700;font-size:clamp(17px,1.65vw,24px);white-space:nowrap}.brand em{font-style:normal;color:var(--teal)}
.ghost{background:white;border:1px solid var(--line);color:#406069;border-radius:11px;padding:7px 15px;font-size:clamp(12px,1.1vw,15px);font-weight:700}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:white;border:1px solid #e2edea;border-radius:clamp(14px,2vw,23px);box-shadow:0 12px 40px #0c3d3610;padding:clamp(12px,2vh,26px) clamp(11px,3vw,48px);overflow:hidden}
.start-page,.results-page{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(10px,2.1vh,23px)}
.start-symbol{width:clamp(80px,10vw,130px);height:clamp(80px,10vw,130px);border-radius:28px;background:#eaf5f2;border:1px solid #cce4de;display:flex;align-items:center;justify-content:center;font-size:clamp(43px,5vw,66px);transform:rotate(-4deg)}
.start-page h1{font-size:clamp(35px,5vw,72px);line-height:1.25;margin:0;color:var(--ink)}.start-page h1 b{color:var(--teal)}
.start-desc{max-width:950px;color:#59757d;font-size:clamp(20px,2vw,29px);line-height:1.8;font-weight:600;margin:0}
.start-stats{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:clamp(7px,1.3vw,20px)}.start-stat{border:1px solid #d7eae4;background:#f4faf8;padding:8px clamp(12px,2vw,24px);font-weight:700;border-radius:15px;color:#245e65;font-size:clamp(16px,1.5vw,22px)}
.start-action,.cta{border:0;background:var(--teal);color:white;border-radius:15px;font-weight:700;padding:clamp(10px,1.8vh,18px) clamp(22px,3vw,48px);font-size:clamp(20px,2.05vw,29px);box-shadow:0 5px 13px #0b747824}
.start-action:active,.cta:active{transform:scale(.98)}.secondary-action{background:white;color:var(--teal);border:2px solid #bee0dc;box-shadow:none}.start-actions{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
.progress-top{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:7px;color:#436a70;font-size:clamp(12px,1.3vw,19px);font-weight:700}.progress-current{color:var(--teal)}.progress-bar{height:7px;background:#e5efec;border-radius:99px;overflow:hidden;flex-shrink:0;margin:3px 0 0}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#0a787a,#48a59c);border-radius:99px;transition:width .3s}
.essay-screen{display:flex;flex:1;flex-direction:column;min-height:0;gap:clamp(9px,1.8vh,22px)}
.question-zone{flex-shrink:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:clamp(8px,1.5vh,20px) clamp(4px,2.5vw,25px);text-align:center}
.question-label{font-size:clamp(13px,1.35vw,18px);color:var(--teal);font-weight:700;letter-spacing:.01em}.question-text{margin:0;max-width:1220px;font-weight:700;line-height:1.48;font-size:clamp(34px,4.25vw,67px);text-wrap:balance}
.answering-zone{flex:1;display:flex;min-height:0;flex-direction:column;align-items:center;justify-content:center;gap:clamp(9px,1.8vh,21px);border:1px solid #ddece8;background:#f4faf8;border-radius:20px;padding:clamp(9px,2vh,20px)}
.time-title{font-size:clamp(17px,1.9vw,26px);font-weight:700;color:#587980}.timer{font:bold clamp(94px,12vw,177px)/1 Tahoma,Arial,sans-serif;letter-spacing:-.075em;color:var(--teal);font-variant-numeric:tabular-nums;direction:ltr;text-align:center;font-feature-settings:'tnum'}
.timer.warn{color:#b57624}.timer.over{color:#a84457;animation:breathe 1.6s ease-in-out infinite}@keyframes breathe{50%{opacity:.6}}
.clockline{height:7px;width:min(510px,86%);background:#dcebe7;border-radius:999px;overflow:hidden;direction:ltr}.clockfill{background:#23a38d;height:100%;width:100%;transition:width .2s linear}.time-tip{text-align:center;min-height:26px;color:#5e7f83;font-weight:700;font-size:clamp(17px,1.55vw,24px);margin:0;line-height:1.45}
.bottom-action{display:flex;align-items:center;flex-direction:column;justify-content:center;flex-shrink:0;gap:5px;padding-bottom:2px}.bottom-action .cta{width:min(610px,100%);font-size:clamp(20px,2vw,27px)}.tiny{color:#7d9697;font-size:clamp(12px,1.1vw,15px);margin:0;text-align:center}
/* A larger answer card replaces the clock ONLY after the child presses Done. */
.review .essay-screen{gap:clamp(6px,1.1vh,12px)}.review .question-zone{padding:clamp(2px,.7vh,8px) clamp(3px,1.2vw,15px)}.review .question-text{font-size:clamp(26px,3vw,48px);line-height:1.35}
.answer-card{min-height:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(7px,1.4vh,14px);background:#f3faf7;border:2px solid #cfe6dd;border-radius:19px;padding:clamp(10px,2vh,25px) clamp(12px,2.7vw,35px)}
.answer-heading{color:#0d7163;font-size:clamp(18px,1.8vw,27px);font-weight:700;text-align:center;flex-shrink:0}
.answer-body{font-family:'Markazi Text','El Messiri',serif;font-size:clamp(29px,3.35vw,53px);font-weight:700;text-align:center;line-height:1.35;overflow:hidden;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.15vh,12px)}.answer-text{max-width:1080px}
.answer-points{margin:0;list-style:none;padding:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);align-items:stretch;width:100%;max-width:1080px}.answer-point{display:flex;align-items:center;gap:clamp(11px,1.7vw,20px);background:white;border:1px solid #d5e9e2;border-radius:12px;padding:clamp(4px,.7vh,9px) clamp(8px,1.3vw,15px);font-size:clamp(25px,2.9vw,43px);line-height:1.15;text-align:right}.answer-point .bullet{flex:0 0 clamp(30px,2.8vw,40px);height:clamp(30px,2.8vw,40px);display:flex;align-items:center;justify-content:center;background:#dcf2e8;color:#0d7063;border-radius:50%;font:700 clamp(16px,1.5vw,22px) Tahoma,Arial,sans-serif}
.selfcheck{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:clamp(7px,1vh,12px)}.self-title{font-size:clamp(18px,1.6vw,25px);font-weight:700;color:#536d75;text-align:center}.pen{font-size:1.3em;color:#915369}.grades{display:flex;gap:clamp(5px,1.2vw,11px);width:100%;max-width:850px;justify-content:center}.grade{flex:1;border:2px solid #dfeae7;border-radius:12px;background:#fff;color:#4c6971;font-size:clamp(15px,1.35vw,20px);font-weight:700;padding:clamp(6px,1vh,12px) 5px;white-space:nowrap}.grade.selected{background:#e6f6f0;border-color:#1e9a7d;color:#056a55}.grade.selected.review-later{background:#fff5e9;border-color:#cf9953;color:#945c29}
.review-next{width:min(550px,100%);font-size:clamp(17px,1.8vw,24px);padding:clamp(8px,1.15vh,14px) 20px}
.results-page h1{font-size:clamp(35px,4vw,62px);margin:0;line-height:1.3}.results-page .message{font-size:clamp(18px,2vw,28px);color:#506d73;margin:0;line-height:1.7}.score-boxes{display:grid;grid-template-columns:repeat(3,1fr);width:min(840px,100%);gap:clamp(7px,1.5vw,17px)}.score-box{padding:clamp(10px,2vh,25px);border:1px solid #d9e8e2;border-radius:16px;background:#f6faf8;font-size:clamp(16px,1.45vw,21px);font-weight:700;color:#536e71}.score-number{display:block;font-family:Tahoma,Arial,sans-serif;font-size:clamp(35px,4.5vw,64px);color:#0d7770}.revise{font-size:clamp(16px,1.7vw,23px);color:#7b694a;max-width:900px;line-height:1.5;margin:0}
@media(max-width:700px){#app{gap:5px;padding:6px}.top{min-height:35px}.brand{font-size:15px}.ghost{font-size:11px;padding:5px 9px}.panel{padding:11px 9px;border-radius:15px}.progress-top{font-size:12px}.question-zone{padding:5px 3px}.question-label{font-size:13px}.question-text{font-size:clamp(30px,7.6vw,42px);line-height:1.42}.essay-screen{gap:9px}.answering-zone{gap:9px;border-radius:12px;padding:10px 7px}.timer{font-size:clamp(82px,20.5vw,124px)}.time-title{font-size:18px}.time-tip{font-size:16px}.bottom-action .cta{font-size:21px;padding:10px}.review .question-text{font-size:clamp(25px,6vw,33px);line-height:1.3}.review .question-label{font-size:12px}.answer-card{padding:9px 8px;gap:6px;border-radius:12px}.answer-heading{font-size:18px}.answer-body{font-size:clamp(29px,7vw,37px);line-height:1.19;gap:4px}.answer-points{gap:5px}.answer-point{font-size:clamp(25px,6.5vw,35px);padding:4px 7px;border-radius:9px}.answer-point .bullet{flex-basis:27px;height:27px;font-size:15px}.selfcheck{gap:6px}.self-title{font-size:clamp(16px,4vw,20px)}.grades{gap:5px}.grade{font-size:clamp(12px,3.1vw,16px);padding:8px 2px}.review-next{font-size:18px;padding:8px}.start-page{gap:17px}.start-page h1{font-size:clamp(37px,10vw,48px)}.start-desc{font-size:clamp(18px,5vw,24px)}.start-stat{font-size:15px}.score-box{font-size:13px}.score-number{font-size:32px}}
@media(max-height:660px){#app{gap:4px;padding:4px}.top{min-height:30px}.panel{padding:8px}.essay-screen{gap:5px}.question-zone{padding:0 3px}.question-text{font-size:clamp(26px,3.7vw,47px);line-height:1.25}.answering-zone{gap:5px;padding:7px}.time-title{font-size:16px}.timer{font-size:clamp(72px,10vw,129px)}.time-tip{font-size:14px}.bottom-action .cta{padding:8px}.review .question-text{font-size:clamp(22px,3vw,34px);line-height:1.18}.answer-card{padding:7px;gap:3px}.answer-heading{font-size:16px}.answer-body{font-size:clamp(23px,2.9vw,36px);line-height:1.12}.answer-points{gap:3px}.answer-point{font-size:clamp(21px,2.65vw,32px);line-height:1.08;padding:3px 6px}.answer-point .bullet{height:25px;flex-basis:25px}.selfcheck{gap:4px}.self-title{font-size:15px}.grades{gap:4px}.grade{padding:5px 2px;font-size:13px}.review-next{font-size:16px;padding:5px}.results-page{gap:8px}.results-page h1{font-size:35px}}
@media(max-width:700px) and (max-height:700px){.question-text{font-size:clamp(25px,6.5vw,31px)}.review .question-text{font-size:clamp(21px,5.6vw,28px)}.answer-body{font-size:clamp(23px,6vw,30px)}.answer-point{font-size:clamp(21px,5.8vw,29px)}.timer{font-size:clamp(72px,19vw,91px)}.grade{font-size:12px}.answer-heading{font-size:16px}}
@media(max-height:475px){.time-tip{display:none}.question-text{font-size:clamp(22px,3vw,35px)}.timer{font-size:70px}.answering-zone{gap:3px}.review .question-text{font-size:clamp(17px,2.3vw,26px)}.review .answer-body{font-size:clamp(19px,2.1vw,29px)}.review .answer-point{font-size:clamp(17px,2vw,25px)}.self-title{font-size:13px}.grades .grade{font-size:11px}.review-next{padding:4px;font-size:14px}}
@media(max-height:475px){.review .answer-point{font-size:16px!important;padding:1px 3px!important;line-height:1!important;min-height:0!important}.review .answer-points{gap:1px!important}.review .answer-point .bullet{height:19px;flex-basis:19px;font-size:11px}.review .answer-card{padding:4px!important}.review .answer-heading{font-size:14px}}

/* Optional 60-second answer memorization, never graded as a response. */
.question-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(6px,1.2vw,14px);width:min(900px,100%)}
.question-actions .cta{width:100%;min-width:0;font-size:clamp(15px,1.7vw,24px);line-height:1.38;padding:clamp(8px,1.3vh,13px) 5px}
.study-button{background:white!important;color:#0b7174!important;border:2px solid #b6dcd5!important;box-shadow:none!important}
.studying .essay-screen{gap:clamp(5px,1.1vh,11px)}.studying .question-zone{padding:clamp(3px,.7vh,8px) 5px}
.studying .question-text{font-size:clamp(27px,3.2vw,48px);line-height:1.28}
.studying .answer-card{background:#f3faf7;gap:clamp(4px,.8vh,9px);padding:clamp(7px,1.3vh,17px) clamp(8px,2vw,22px)}
.studying .answer-heading{font-size:clamp(17px,1.55vw,23px)}
.studying .answer-body{font-size:clamp(26px,3vw,43px);line-height:1.2;gap:clamp(3px,.65vh,8px)}
.studying .answer-point{font-size:clamp(23px,2.7vw,37px);padding:clamp(3px,.55vh,7px) 8px}
.study-bottom{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1vh,11px)}
.study-clock-row{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,22px);font-size:clamp(17px,1.65vw,24px);font-weight:700;color:#34696e}
.study-clock{font:bold clamp(45px,5.7vw,84px)/1 Tahoma,Arial,sans-serif;color:#087b78;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.study-clock.warn{color:#b57624}.study-clock.paused{color:#8c5971}
.study-controls{display:flex;gap:clamp(6px,1vw,11px);width:100%;max-width:600px}
.study-controls button{flex:1;min-width:0;border:2px solid #c8e0da;background:white;color:#1f696c;border-radius:12px;font-size:clamp(14px,1.5vw,21px);font-weight:700;padding:clamp(6px,1vh,10px) 3px;line-height:1.3}
.study-controls button:disabled{opacity:.35}.study-controls button:hover{background:#e8f7f2;border-color:#358e88}
.study-retry{width:min(610px,100%);font-size:clamp(17px,1.9vw,26px);padding:clamp(8px,1.3vh,13px) 12px;line-height:1.22}
.study-footer-label{font-size:clamp(12px,1vw,15px);color:#607e80;text-align:center;font-weight:600;margin:0}
@media(max-width:700px){
.question-actions .cta{font-size:clamp(14px,3.7vw,19px);padding:9px 4px;border-radius:11px}
.studying .essay-screen{gap:5px}.studying .question-text{font-size:clamp(23px,5.8vw,33px)}
.studying .answer-card{padding:7px 8px;gap:5px}.studying .answer-heading{font-size:16px}
.studying .answer-body{font-size:clamp(24px,6.3vw,32px);line-height:1.17}
.studying .answer-point{font-size:clamp(21px,5.55vw,29px);padding:3px 5px;border-radius:8px}
.studying .answer-point .bullet{flex-basis:24px;height:24px;font-size:14px}
.study-bottom{gap:5px}.study-clock{font-size:clamp(44px,11vw,58px)}.study-clock-row{font-size:16px}
.study-controls button{font-size:clamp(13px,3.7vw,17px);padding:6px 2px;border-radius:9px}
.study-retry{font-size:clamp(18px,4.6vw,22px);padding:7px}
.study-footer-label{font-size:11px}
}
@media(max-height:640px){
.studying .essay-screen{gap:3px}.studying .question-zone{padding:1px 2px}
.studying .question-text{font-size:clamp(20px,2.7vw,32px);line-height:1.15}
.studying .answer-card{padding:5px 7px;gap:2px}.studying .answer-heading{font-size:15px}
.studying .answer-body{font-size:clamp(19px,2.5vw,30px);line-height:1.12}
.studying .answer-point{font-size:clamp(17px,2.25vw,27px);padding:2px 4px}
.studying .answer-point .bullet{flex-basis:22px;height:22px;font-size:12px}
.study-bottom{gap:4px}.study-clock{font-size:43px}.study-controls button{padding:4px;font-size:14px}
.study-retry{padding:6px;font-size:17px}.study-footer-label{display:none}
}
@media(prefers-reduced-motion:reduce){.timer.over{animation:none}*{transition:none!important}}
</style>
</head>

<script>

1,"number":2,"title":"قطر طبيعيًا | أشكال السطح","q":"مَا أَشْكَالُ السَّطْحِ الدَّاخِلِيَّةُ فِي قَطَرَ؟","answer":"الدُّحُولُ وَالتِّلالُ وَالكُثْبانُ الرَّمْلِيَّةُ وَالرَّوْضاتُ.","points":["الدُّحُولُ.","التِّلَالُ.","الْكُثْبَانُ الرَّمْلِيَّةُ.","الرَّوْضَاتُ."]},{"lesson":1,"number":3,"title":"قطر طبيعيًا | أشكال السطح","q":"مَا أَشْكَالُ السَّطْحِ السَّاحِلِيَّةُ فِي قَطَرَ؟","answer":"الجُزُرُ وَالخُلْجانُ وَالرُّؤُوسُ الأَرْضِيَّةُ وَالسَّبَخاتُ الأَرْضِيَّةُ.","points":["الْجُزُرُ.","الْخُلْجَانُ.","الرُّؤُوسُ الْأَرْضِيَّةُ.","السَّبَخَاتُ الْأَرْضِيَّةُ."]},{"lesson":1,"number":4,"title":"قطر طبيعيًا | أشكال السطح","q":"مَا الْمَقْصُودُ بِالرَّوْضَاتِ؟","answer":"أَرْضٌ مُنْخَفِضَةٌ تَتَجَمَّعُ فِيها مِياهُ الأَمْطارِ وَتُرْبَتُها طِينِيَّةٌ خَصْبَةٌ.","points":[]},{"lesson":1,"number":5,"title":"قطر طبيعيًا | أشكال السطح","q":"مَا الْمَقْصُودُ بِالْكُثْبَانِ الرَّمْلِيَّةِ؟","answer":"كُتَلٌ مِنَ الرِّمالِ تَكَوَّنَتْ بِفِعْلِ الرِّياحِ.","points":[]},{"lesson":1,"number":6,"title":"قطر طبيعيًا | أشكال السطح","q":"مَا الْمَقْصُودُ بِالْجُزُرِ؟","answer":"أَرْضٌ تُحِيطُ بِها المِياهُ مِنْ جَمِيعِ الجِهاتِ.","points":[]},{"lesson":1,"number":7,"title":"قطر طبيعيًا | أشكال السطح","q":"مَا الْمَقْصُودُ بِالْخُلْجَانِ؟","answer":"تَوَغُّلُ مِياهِ البَحْرِ داخِلَ اليابِسِ.","points":[]},{"lesson":2,"number":1,"title":"قطر طبيعيًا | المناخ والحياة","q":"بِمَاذَا يَتَمَيَّزُ شِتَاءُ قَطَرَ؟","answer":"انْخِفاضُ دَرَجاتِ الحَرارَةِ وَسُقُوطُ الأَمْطارِ وَحُدُوثُ الضَّبابِ.","points":["انْخِفَاضُ دَرَجَاتِ الْحَرَارَةِ.","سُقُوطُ الْأَمْطَارِ.","حُدُوثُ الضَّبَابِ."]},{"lesson":2,"number":2,"title":"قطر طبيعيًا | المناخ والحياة","q":"بِمَاذَا يَتَمَيَّزُ صَيْفُ قَطَرَ؟","answer":"ارْتِفاعُ دَرَجاتِ الحَرارَةِ وَالرُّطُوبَةِ وَانْعِدامُ سُقُوطِ الأَمْطارِ.","points":["ارْتِفَاعُ دَرَجَاتِ الْحَرَارَةِ.","ارْتِفَاعُ الرُّطُوبَةِ.","انْعِدَامُ سُقُوطِ الْأَمْطَارِ."]},{"lesson":2,"number":3,"title":"قطر طبيعيًا | المناخ والحياة","q":"مَا أَمْثِلَةُ النَّبَاتَاتِ ا َطَرَ إِمارَةً مُسْتَقِلَّةً.","points":[]},{"lesson":3,"number":7,"title":"أسرة آل ثاني","q":"مَنْ أَوَّلُ حَاكِمٍ يَظْهَرُ فِي التَّسَلْسُلِ؟","answer":"الشَّيْخُ مُحَمَّدُ بْنُ ثانِي.","points":[]},{"lesson":3,"number":8,"title":"أسرة آل ثاني","q":"مَنْ تَوَلَّى الْحُكْمَ عَامَ 2013؟","answer":"الشَّيْخُ تَمِيمُ بْنُ حَمَدٍ آل ثانِي.","points":[]},{"lesson":4,"number":1,"title":"نشأة إمارة قطر","q":"أَيْنَ نَشَأَ الشَّيْخُ جَاسِمُ بْنُ مُحَمَّدٍ بْنِ ثَانِي؟","answer":"نَشَأَ فِي مَدِينَةِ الدَّوْحَةِ.","points":[]},{"lesson":4,"number":2,"title":"نشأة إمارة قطر","q":"فِي أَيِّ تِجَارَةٍ عَمِلَ الشَّيْخُ جَاسِمٌ مَعَ وَالِدِهِ؟","answer":"عَمِلَ مَعَ والِدِهِ فِي تِجارَةِ اللُّؤْلُؤِ.","points":[]},{"lesson":4,"number":3,"title":"نشأة إمارة قطر","q":"مَتَى تَوَلَّى الشَّيْخُ جَاسِمٌ حُكْمَ قَطَرَ؟","answer":"تَوَلَّى حُكْمَ قَطَرَ فِي 18 دِيسَمْبَرَ 1878م.","points":[]},{"lesson":4,"number":4,"title":"نشأة إمارة قطر","q":"مَا اللَّقَبُ الَّذِي مَنَحَتْهُ الدَّوْلَةُ الْعُثْمَانِيَّةُ لِلشَّيْخِ جَاسِمٍ؟","answer":"مَنَحَتْهُ الدَّوْلَةُ العُثْمانِيَّةُ لَقَبَ قائِمَقام.","points":[]},{"lesson":4,"number":5,"title":"نشأة إمارة قطر","q":"مَتَى تُوُفِّيَ الشَّيْخُ جَاسِمٌ وَأَيْنَ دُفِنَ؟","answer":"تُوُفِّيَ عامَ 1913م وَدُفِنَ فِي لُوسَيْلَ.","points":[]},{"lesson":4,"number":6,"title":"نشأة إمارة قطر","q":"مَا السَّبَبُ الْأَوَّلُ لِمَعْرَكَةِ الْوَجْبَةِ؟","answer":"مُحاوَلَةُ فَرْضِ الضَّرائِبِ عَلى تُجَّارِ اللُّؤْلُؤِ.","points":[]},{"lesson":4,"number":7,"title":"نشأة إمارة قطر","q":"مَا السَّبَبُ الثَّانِي لِمَعْرَكَةِ الْوَجْبَةِ؟","answer":"اعْتِقالُ الوالِي العُثْمانِيِّ لِلشَّيْخِ أَحْمَدَ وَمَنْ مَعَهُ.","points":[]},{"lesson":4,"number":8,"title":"نشأة إمارة قطر","q":"بَيْنَ مَنْ دَارَتْ مَعْرَكَةُ الْوَجْبَةِ؟","answer":"القَبائِلُ القَطَرِيَّةُ وَالدَّوْلَةُ العُثْمانِيَّةُ.","points":[]},{"lesson":4,"number":9,"title":"نشأة إمارة قطر","q":"مَا نَتَائِجُ مَعْرَكَةِ الْوَجْبَةِ؟","answer":"انْتِصارُ القُوَّاتِ القَطَرِيَّةِ وَفَكُّ أَسْرِ الشَّيْخِ أَحْمَدَ وَمَنْ مَعَهُ.","points":["انْتِصَارُ الْقُوَّاتِ الْقَطَرِيَّةِ.","فَكُّ أَسْرِ الشَّيْخِ أَحْمَدَ وَمَنْ مَعَهُ."]},{"lesson":4,"number":10,"title":"نشأة إمارة قطر","q":"مَا أَبْرَزُ صِفَاتِ الشَّيْخِ جَاسِمٍ؟","answer":"الشَّجاعَةُ وَحُبُّ العِلْمِ.","points":["الشَّجَاعَةُ.","حُبُّ الْعِلْمِ."]},{"lesson":4,"number":11,"title":"نشأة إمارة قطر","q":"مَا أَبْرَزُ أَعْمَالِ الشَّيْخِ جَاسِمٍ الدِّينِيَّةِ؟","answer":"بِناءُ المَساجِدِ وَاسْتِضافَةُ العُلَماءِ.","points":["بِنَاءُ الْمَسَاجِدِ.","اسْتِضَافَةُ الْعُلَمَاءِ."]},{"lesson":4,"number":12,"title":"نشأة إمارة قطر","q":"بِمَاذَا تَمَيَّزَ عَهْدُ الشَّيْخِ جَاسِمٍ؟","answer":"انْتِشارُ الأَمْنِ وَالعَدْلِ وَالرَّخاءِ وَازْدِهارُ التِّجارَةِ.","points":["انْتِشَارُ الْأَمْنِ.","انْتِشَارُ الْعَدْلِ.","انْتِشَارُ الرَّخَاءِ.","ازْدِهَارُ التِّجَارَةِ."]}];
const DURATION=180;
const KEY='mutassim-essay-progress-v1';
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let questions=DATA.map((item,i)=>({...item,id:i}));
let index=0,remaining=DURATION,deadline=0,ticker=null,step='home',grades={},sequence=questions.map(q=>q.id),activeId=null;
let studyRemaining=60,studyDeadline=0,studyPaused=false;
function safeRead(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function safeSave(){try{localStorage.setItem(KEY,JSON.stringify({index,grades,sequence,step:step==='result'?'result':'exam'}))}catch{}}
function stopTimer(){if(ticker!==null){clearInterval(ticker);ticker=null}}
function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function active(){return questions.find(q=>q.id===sequence[index])}
function home(){stopTimer();step='home';document.body.classList.remove('review','studying');const old=safeRead();const canResume=old&&Array.isArray(old.sequence)&&old.sequence.length>0&&old.step!=='result';const completed=old&&Object.keys(old.grades||{}).length||0;
 $('#screen').innerHTML=`<div class="start-page"><div class="start-symbol" aria-hidden="true">📝</div><h1>تَحَدِّي <b>القَلَمِ وَالوَرَقَةِ</b></h1><p class="start-desc">اِقْرَأِ السُّؤَالَ، وَأَجِبْ عَلَى وَرَقَتِكَ، ثُمَّ صَحِّحْ إِجَابَتَكَ بِنَفْسِكَ.</p><div class="start-stats"><div class="start-stat">42 سُؤَالًا مَقَالِيًّا</div><div class="start-stat">5 دُرُوسٍ</div><div class="start-stat">3 دَقَائِقَ لِكُلِّ سُؤَالٍ</div></div><div class="start-actions"><button class="start-action" id="begin">${canResume?'اِسْتَكْمِلِ الِاخْتِبَارَ':'اِبْدَأِ الِاخْتِبَارَ'} ←</button>${canResume?'<button class="start-action secondary-action" id="fresh">مِنَ الْبِدَايَةِ ↺</button>':''}</div>${canResume?`<p class="tiny">حُفِظَ تَقَدُّمُكَ سَابِقًا · ${completed} سُؤَالًا مُصَحَّحًا</p>`:''}</div>`;
 $('#begin').onclick=()=>{if(canResume){const seq=old.sequence.filter(id=>Number.isInteger(id)&&id>=0&&id<questions.length);sequence=seq.length?seq:questions.map(q=>q.id);index=Math.max(0,Math.min(old.index||0,sequence.length-1));grades=old.grades||{}}else freshStart();renderQuestion()};
 if($('#fresh'))$('#fresh').onclick=()=>{freshStart();renderQuestion()};
}
function freshStart(){stopTimer();index=0;grades={};sequence=questions.map(q=>q.id);activeId=null;safeSave()}
function startClock(){stopTimer();remaining=DURATION;deadline=Date.now()+DURATION*1000;updateClock();ticker=setInterval(()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));updateClock();if(remaining===0)stopTimer()},220)}
function updateClock(){const clock=$('#clock'),fill=$('#clockfill'),hint=$('#timeHint');if(!clock)return;clock.textContent=formatTime(remaining);clock.classList.toggle('warn',remaining<=30&&remaining>0);clock.classList.toggle('over',remaining===0);if(fill)fill.style.width=(remaining/DURATION*100)+'%';if(hint)hint.textContent=remaining===0?'انْتَهَى الْوَقْتُ. اِضْغَطْ «تَمَّ» لِتُصَحِّحَ إِجَابَتَكَ.':'اُكْتُبْ إِجَابَتَكَ عَلَى الْوَرَقَةِ بِقَلَمِكَ.'}
function progress(){const q=active();return `<div class="progress-top"><span class="progress-current">السُّؤَالُ ${index+1} مِنْ ${sequence.length}</span><span>${escapeHTML(q.title)}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${(index/sequence.length)*100}%"></div></div>`}
function renderQuestion(){stopTimer();if(index>=sequence.length){showResults();return}const q=active();activeId=q.id;step='question';document.body.classList.remove('review','studying');
 $('#screen').innerHTML=`<section class="essay-screen">${progress()}<div class="question-zone"><span class="question-label">أَجِبْ عَنِ السُّؤَالِ الْآتِي</span><h1 class="question-text">${escapeHTML(q.q)}</h1></div><div class="answering-zone"><div class="time-title">الْوَقْتُ الْمُتَبَقِّي</div><div class="timer" id="clock" role="timer" aria-label="الوقت المتبقي" aria-live="off">03:00</div><div class="clockline"><div class="clockfill" id="clockfill"></div></div><p class="time-tip" id="timeHint">اُكْتُبْ إِجَابَتَكَ عَلَى الْوَرَقَةِ بِقَلَمِكَ.</p></div><div class="bottom-action"><div class="question-actions"><button class="cta" id="doneBtn">تَمَّ ✓ صَحِّحْ إِجَابَتَكَ</button><button class="cta study-button" id="studyBtn">لَا أَعْرِفُهَا · أُرِيدُ الْحِفْظَ</button></div><p class="tiny">إِذَا تَعَثَّرْتَ، احْفَظِ الْإِجَابَةَ لِدَقِيقَةٍ ثُمَّ حَاوِلِ السُّؤَالَ نَفْسَهُ.</p></div></section>`;
 $('#doneBtn').onclick=revealAnswer;
  $('#studyBtn').onclick=beginStudy;
 safeSave();startClock()}
function answerHTML(q){return q.points.length?`<ol class="answer-points">${q.points.map((x,i)=>`<li class="answer-point"><span class="bullet">${i+1}</span><span>${escapeHTML(x)}</span></li>`).join('')}</ol>`:`<div class="answer-text">${escapeHTML(q.answer)}</div>`}

/* An independent 60-second learning clock, adjustable in 15s increments.
   On expiry or manual finish, the SAME question restarts with 3 fresh minutes. */
function beginStudy(){
 if(step!=='question')return;
 stopTimer();step='study';
 studyRemaining=60;studyPaused=false;studyDeadline=Date.now()+60000;
 document.body.classList.remove('review');document.body.classList.add('studying');
 const q=active();
 $('#screen').innerHTML=`<section class="essay-screen">${progress()}
   <div class="question-zone"><span class="question-label">اِقْرَأِ السُّؤَالَ وَاحْفَظِ الْإِجَابَةَ</span><h1 class="question-text">${escapeHTML(q.q)}</h1></div>
   <div class="answer-card"><div class="answer-heading">الْإِجَابَةُ الصَّحِيحَةُ — احْفَظْهَا</div><div class="answer-body">${answerHTML(q)}</div></div>
   <div class="study-bottom">
     <div class="study-clock-row"><span>وَقْتُ الْحِفْظِ</span><strong class="study-clock" id="studyClock" role="timer" aria-label="وقت الحفظ المتبقي">01:00</strong></div>
     <div class="study-controls">
       <button id="studyMinus" type="button">− 15 ثَانِيَةً</button>
       <button id="studyPause" type="button">⏸ إِيقَافٌ مُؤَقَّتٌ</button>
       <button id="studyPlus" type="button">+ 15 ثَانِيَةً</button>
     </div>
     <button class="cta study-retry" id="studyRetry">حَفِظْتُهَا ✓ أَعِدِ السُّؤَالَ</button>
     <p class="study-footer-label">عِنْدَ انْتِهَاءِ الْوَقْتِ تُخْفَى الْإِجَابَةُ وَيَعُودُ السُّؤَالُ نَفْسُهُ.</p>
   </div></section>`;
 $('#studyMinus').onclick=()=>adjustStudy(-15);
 $('#studyPlus').onclick=()=>adjustStudy(15);
 $('#studyPause').onclick=toggleStudyPause;
 $('#studyRetry').onclick=retryAfterStudy;
 updateStudyClock();startStudyTicker();
}
function startStudyTicker(){
 stopTimer();if(step!=='study'||studyPaused)return;
 studyDeadline=Date.now()+studyRemaining*1000;
 ticker=setInterval(()=>{
  if(step!=='study'||studyPaused){stopTimer();return}
  studyRemaining=Math.max(0,Math.ceil((studyDeadline-Date.now())/1000));
  updateStudyClock();
  if(studyRemaining===0)retryAfterStudy();
 },200);
}
function updateStudyClock(){
 const clock=$('#studyClock');if(!clock)return;
 clock.textContent=formatTime(studyRemaining);
 clock.classList.toggle('warn',studyRemaining<=15&&!studyPaused);
 clock.classList.toggle('paused',studyPaused);
 if($('#studyMinus'))$('#studyMinus').disabled=studyRemaining<=15;
 if($('#studyPlus'))$('#studyPlus').disabled=studyRemaining>=300;
 if($('#studyPause'))$('#studyPause').textContent=studyPaused?'▶ مُتَابَعَةُ الْحِفْظِ':'⏸ إِيقَافٌ مُؤَقَّتٌ';
}
function adjustStudy(delta){
 if(step!=='study')return;
 if(!studyPaused)studyRemaining=Math.max(0,Math.ceil((studyDeadline-Date.now())/1000));
 studyRemaining=Math.max(15,Math.min(300,studyRemaining+delta));
 if(!studyPaused)studyDeadline=Date.now()+studyRemaining*1000;
 updateStudyClock();
}
function toggleStudyPause(){
 if(step!=='study')return;
 if(studyPaused){studyPaused=false;startStudyTicker()}
 else{
  studyRemaining=Math.max(0,Math.ceil((studyDeadline-Date.now())/1000));
  studyPaused=true;stopTimer();
 }
 updateStudyClock();
}
function retryAfterStudy(){
 if(step!=='study')return;
 stopTimer();studyPaused=false;
 // Erase the answer and display exactly the same question, with 03:00 again.
 renderQuestion();
}

function revealAnswer(){if(step!=='question')return;stopTimer();step='review';document.body.classList.add('review');const q=active();const previous=grades[q.id];
 $('#screen').innerHTML=`<section class="essay-screen">${progress()}<div class="question-zone"><span class="question-label">السُّؤَالُ ${index+1}</span><h1 class="question-text">${escapeHTML(q.q)}</h1></div><div class="answer-card"><div class="answer-heading">الْإِجَابَةُ النَّمُوذَجِيَّةُ ✓</div><div class="answer-body">${answerHTML(q)}</div></div><div class="selfcheck"><div class="self-title"><span class="pen" aria-hidden="true">🖊️</span> صَحِّحْ بِقَلَمِكَ عَلَى وَرَقَتِكَ، ثُمَّ قَيِّمْ إِجَابَتَكَ</div><div class="grades"><button class="grade" data-grade="yes">✓ صَحِيحَةٌ</button><button class="grade" data-grade="part">◐ نَاقِصَةٌ</button><button class="grade" data-grade="again">↻ أُرَاجِعُهَا</button></div><button class="cta review-next" id="nextBtn">${index===sequence.length-1?'عَرْضُ النَّتِيجَةِ ←':'السُّؤَالُ التَّالِي ←'}</button></div></section>`;
 $$('[data-grade]').forEach(btn=>btn.onclick=()=>chooseGrade(btn.dataset.grade));
 $('#nextBtn').onclick=nextQuestion;if(previous)highlightGrade(previous);
}
const $$=s=>Array.from(document.querySelectorAll(s));
function highlightGrade(g){$$('[data-grade]').forEach(b=>{b.classList.toggle('selected',b.dataset.grade===g);b.classList.toggle('review-later',b.dataset.grade===g&&g==='again')})}
function chooseGrade(g){if(step!=='review')return;grades[active().id]=g;highlightGrade(g);safeSave()}
function nextQuestion(){if(step!=='review')return;index++;if(index>=sequence.length){showResults();return}renderQuestion()}
function showResults(){stopTimer();step='result';document.body.classList.remove('review','studying');safeSave();const ids=sequence;const counts={yes:0,part:0,again:0,blank:0};ids.forEach(id=>{const mark=grades[id];if(mark&&counts[mark]!==undefined)counts[mark]++;else counts.blank++});const need=questions.filter(q=>grades[q.id]==='part'||grades[q.id]==='again');
 $('#screen').innerHTML=`<div class="results-page"><div class="start-symbol" aria-hidden="true">🏅</div><h1>أَحْسَنْتَ يَا مُعْتَصِمُ!</h1><p class="message">أَتْمَمْتَ ${ids.length} سُؤَالًا مَقَالِيًّا، وَصَحَّحْتَ إِجَابَاتِكَ عَلَى الْوَرَقَةِ.</p><div class="score-boxes"><div class="score-box"><span class="score-number">${counts.yes}</span>صَحِيحَةٌ</div><div class="score-box"><span class="score-number">${counts.part}</span>نَاقِصَةٌ</div><div class="score-box"><span class="score-number">${counts.again}</span>أَحْتَاجُ مُرَاجَعَتَهَا</div></div>${counts.blank?`<p class="revise">${counts.blank} أَسْئِلَةٍ لَمْ تُقَيَّمْ بَعْدُ.</p>`:''}<div class="start-actions">${need.length?`<button class="start-action" id="retryWeak">أُرَاجِعُ ${need.length} سُؤَالًا ←</button>`:''}<button class="start-action secondary-action" id="redoAll">أُعِيدُ الِاخْتِبَارَ كَامِلًا ↺</button></div></div>`;
 if($('#retryWeak'))$('#retryWeak').onclick=()=>{sequence=need.map(x=>x.id);index=0;renderQuestion()};$('#redoAll').onclick=()=>{freshStart();renderQuestion()}
}
$('#homeBtn').onclick=home;
window.addEventListener('keydown',e=>{if(e.key==='Enter'&&step==='question'&&!e.repeat){revealAnswer()}else if(e.key==='ArrowLeft'&&step==='review'){nextQuestion()}else if(e.key==='Escape'&&step==='study'){retryAfterStudy()}});
home();
</script>
</body></html>
